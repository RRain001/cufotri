schema_version: v1
stage: P7.7A
status: DEFINITION_ONLY
cases:
  - case_id: v3-p7-7a-radioactive-decay
    description: Synthetic inventory decay trajectory against an analytic reference.
    scenario_type: SYNTHETIC_BENCHMARK
    forcing_definition:
      forcing_id: radioactive-decay-zero-input
      time_basis: seconds_from_initial_state
      variables:
        external_input:
          value: 0.0
          unit: Bq m^-2 s^-1
    initial_state:
      state_id: soil-inventory
      variables:
        inventory:
          value: 100.0
          unit: Bq m^-2
    parameter_context:
      - parameter_id: half_life
        value: 10.0
        unit: s
        status: TEST_ONLY
        provenance:
          source_kind: SYNTHETIC_FIXTURE
          source_identifier: p7.7a-radioactive-decay-half-life-fixture
          artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          license_or_access_basis: repository_controlled_test_fixture
          locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#radioactive-decay
    model_outputs:
      - observable_id: inventory
        quantity: decayed_inventory
        unit: Bq m^-2
        time_basis: seconds_from_initial_state
        output_reference: model_outputs.inventory
    reference_data:
      - observable_id: inventory
        quantity: analytic_decayed_inventory
        unit: Bq m^-2
        time_basis: seconds_from_initial_state
        reference_method: ANALYTIC_SOLUTION
        reference_expression: "N(t) = N0 * exp(-ln(2) * t / T_half)"
        independent: true
        provenance:
          source_kind: SYNTHETIC_FIXTURE
          source_identifier: p7.7a-radioactive-decay-analytic-reference
          artifact_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          license_or_access_basis: repository_controlled_test_fixture
          locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#radioactive-decay-reference
    expected_metric:
      metric_name: decay_error
      observable_id: inventory
      unit: Bq m^-2
    acceptance_criteria:
      - metric_name: decay_error
        observable_id: inventory
        threshold: 1.0e-12
        comparison: ABSOLUTE_LTE
        unit: Bq m^-2
        rationale: Analytic semantic benchmark tolerance only; not half-life validation.
    provenance:
      source_kind: SYNTHETIC_FIXTURE
      source_identifier: p7.7a-radioactive-decay-case
      artifact_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      license_or_access_basis: repository_controlled_test_fixture
      locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#radioactive-decay

  - case_id: v3-p7-7a-leaf-exchange
    description: Explicit leaf flux into TFWT storage without resistance validation.
    scenario_type: SYNTHETIC_BENCHMARK
    forcing_definition:
      forcing_id: explicit-leaf-exchange-flux
      time_basis: seconds_from_initial_state
      variables:
        leaf_exchange_flux:
          value: 2.0
          unit: Bq m^-2 s^-1
    initial_state:
      state_id: tfwt-inventory
      variables:
        inventory:
          value: 0.0
          unit: Bq m^-2
    parameter_context: []
    model_outputs:
      - observable_id: tfwt_inventory
        quantity: tfwt_inventory
        unit: Bq m^-2
        time_basis: seconds_from_initial_state
        output_reference: model_outputs.tfwt_inventory
    reference_data:
      - observable_id: tfwt_inventory
        quantity: integrated_explicit_flux
        unit: Bq m^-2
        time_basis: seconds_from_initial_state
        reference_method: ANALYTIC_FLUX_INTEGRAL
        reference_expression: "M(t) = M0 + integral(J_leaf, dt)"
        independent: true
        provenance:
          source_kind: SYNTHETIC_FIXTURE
          source_identifier: p7.7a-leaf-exchange-integral-reference
          artifact_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          license_or_access_basis: repository_controlled_test_fixture
          locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#leaf-exchange-reference
    expected_metric:
      metric_name: state_difference
      observable_id: tfwt_inventory
      unit: Bq m^-2
    acceptance_criteria:
      - metric_name: state_difference
        observable_id: tfwt_inventory
        threshold: 1.0e-12
        comparison: ABSOLUTE_LTE
        unit: Bq m^-2
        rationale: Explicit-flux storage interface check; leaf resistance is out of scope.
    provenance:
      source_kind: SYNTHETIC_FIXTURE
      source_identifier: p7.7a-leaf-exchange-case
      artifact_sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      license_or_access_basis: repository_controlled_test_fixture
      locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#leaf-exchange

  - case_id: v3-p7-7a-tfwt-obt
    description: Explicit TFWT-to-OBT transfer with test-only formation and turnover rates.
    scenario_type: SYNTHETIC_BENCHMARK
    forcing_definition:
      forcing_id: tfwt-obt-constant-forcing
      time_basis: seconds_from_initial_state
      variables:
        daylight: true
        tfwt_inventory:
          value: 50.0
          unit: Bq m^-2
    initial_state:
      state_id: obt-inventory
      variables:
        inventory:
          value: 0.0
          unit: Bq m^-2
    parameter_context:
      - parameter_id: kf_s
        value: 0.01
        unit: s^-1
        status: TEST_ONLY
        provenance:
          source_kind: SYNTHETIC_FIXTURE
          source_identifier: p7.7a-tfwt-obt-kf-fixture
          artifact_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          license_or_access_basis: repository_controlled_test_fixture
          locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#tfwt-obt-kf
      - parameter_id: kr_s
        value: 0.02
        unit: s^-1
        status: TEST_ONLY
        provenance:
          source_kind: SYNTHETIC_FIXTURE
          source_identifier: p7.7a-tfwt-obt-kr-fixture
          artifact_sha256: "1111111111111111111111111111111111111111111111111111111111111111"
          license_or_access_basis: repository_controlled_test_fixture
          locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#tfwt-obt-kr
    model_outputs:
      - observable_id: obt_inventory
        quantity: obt_inventory
        unit: Bq m^-2
        time_basis: seconds_from_initial_state
        output_reference: model_outputs.obt_inventory
    reference_data:
      - observable_id: obt_inventory
        quantity: analytic_linear_obt_inventory
        unit: Bq m^-2
        time_basis: seconds_from_initial_state
        reference_method: ANALYTIC_LINEAR_STORAGE
        reference_expression: "dM_obt/dt = kf * M_tfwt - kr * M_obt"
        independent: true
        provenance:
          source_kind: SYNTHETIC_FIXTURE
          source_identifier: p7.7a-tfwt-obt-analytic-reference
          artifact_sha256: "2222222222222222222222222222222222222222222222222222222222222222"
          license_or_access_basis: repository_controlled_test_fixture
          locator: configs/v3/validation/p7_7a_baseline_benchmarks.yaml#tfwt-obt-reference
    expected_metric:
      metric_name: trajectory_comparison
      observable_id: obt_inventory
      unit: Bq m^-2
    acceptance_criteria:
      - metric_name: trajectory_comparison
        observable_id: obt_inventory
        threshold: 1.0e-12
        comparison: ABSOLUTE_LTE
        unit: Bq m^-2
        rationale: Linear transfer semantic check; kf and kr physical validity are out of scope.
    provenance:
      source_kind: SYNTHETIC_FIXTURE

        quantity: explicit_coefficient_flux
        unit: Bq m^-2 s^-1
        time_basis: seconds_from_initial_state
        reference_method: ANALYTIC_LINEAR_FLUX
        reference_expression: "J_root = k_root * C_root_zone"

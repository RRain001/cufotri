atmosphere:
  deposition_velocity_m_s: 0.005
  calm_wind:
    mode: minimum_effective_wind
    threshold_m_s: 0.5
    effective_wind_m_s: 0.5
    record_substitution: true
  depletion:
    enabled: true
    dry_deposition_enabled: true
    wet_scavenging_enabled: false
    wet_scavenging_mode: "off"
    method: segment_exponential
    mixing_height_m: 1000.0
    segments: 20
    wet_scavenging_rate_s: 0.0
    constant_scavenging_coefficient_s: 0.0
    wet_scavenging_parameter_set: iaea_emras_japanet_comparison
    wet_scavenging_parameter_sets:
      iaea_emras_japanet_comparison:
        a: 5.0e-5
        b: 0.8
        precipitation_unit: mm_h
        status: LITERATURE_COMPARISON_NOT_UFOTRI
        source: IAEA EMRAS Tritium WG final report, Japanet Eq. II.8.7
      project_low:
        a: 1.0e-5
        b: 0.6
        precipitation_unit: mm_h
        status: PROJECT_UNCERTAINTY_BOUND
        source: project bracket
      project_central:
        a: 5.0e-5
        b: 0.8
        precipitation_unit: mm_h
        status: PROJECT_UNCERTAINTY_BOUND
        source: project bracket centred on literature comparison
      project_high:
        a: 1.0e-4
        b: 1.0
        precipitation_unit: mm_h
        status: PROJECT_UNCERTAINTY_BOUND
        source: project bracket
    power_law_a_s: 5.0e-5
    power_law_b: 0.8
  fixed_plume_rise_m: 15.0
  plume_rise_mode: fixed
  stability_mode: fixed
  stability_class: D
  surface_roughness_m: 0.1
  wind_reference_height_m: 10.0
  rural_wind_profile_exponent: 0.20
  reemission_feedback_area_m2: 1000000.0
  reemission_feedback_mode: area_source
  area_source_length_m: 1000.0
  area_source_width_m: 1000.0
  area_source_quadrature_x: 12
  area_source_quadrature_y: 12
  mixing_height_m: null
  mixing_layer_image_terms: 4
coupling:
  reemission_feedback_delay_s: 3600
  feedback_rectangle:
    length_m: 1000.0
    width_m: 1000.0
  feedback_area_m2: 1000000.0
deposition:
  dry_footprint:
    allocation: uniform
    area_m2: 1000000.0
  wet_footprint:
    allocation: uniform
    area_m2: 1000000.0
soil:
  layer_model: single_top_5cm
  depth_m: 0.05
  initial_water_m: 0.010
  wilting_water_m: 0.004
  maximum_water_m: 0.020
  minimum_water_m: 0.0005
  infiltration_capacity_m_s: 0.00001
  runoff_enabled: false
  rain_hto_concentration_bq_m3: 0.0
  root_uptake_delay_seconds: 0
  multibox:
    status: PROJECT_EXTENSION_EXPERIMENTAL
    layer_depth_m: [0.05, 0.10, 0.15]
    initial_water_m: [0.010, 0.025, 0.0375]
    maximum_water_m: [0.020, 0.040, 0.060]
    root_fractions: [0.20, 0.40, 0.40]
    interlayer_drainage_rate_s: [1.7361111111e-6, 5.7870370370e-7]
    deep_leakage_rate_s: 9.4907407407e-8
    diffusive_exchange_m_s: 1.0e-9
    decay_rate_s: 1.7828335e-9
plant:
  lai: 1.5
  water_storage_m: 0.0005
  leaf_exchange_mode: "off"
  direct_leaf_uptake_enabled: false
  direct_leaf_velocity_m_s: 0.0
  # LITERATURE_PARAMETERIZATION: UFOTRI resistance equations with Golder
  # stability mapping and a laminar flat-plate Sherwood correlation.
  leaf_resistance_parameterization: golder_monin_obukhov_flat_plate
  leaf_canopy_height_m: 1.0
  leaf_characteristic_length_m: 0.05
  leaf_air_kinematic_viscosity_m2_s: 1.5e-5
  leaf_water_vapour_diffusivity_m2_s: 2.5e-5
  leaf_von_karman_constant: 0.4
  leaf_minimum_wind_speed_m_s: 0.05
  leaf_stomatal_resistance_day_s_m: 400.0
  leaf_stomatal_resistance_night_s_m: 6000.0
  leaf_vpd_sensitivity_per_kpa: 0.5
  leaf_isotope_fractionation_liquid_to_vapour: 1.1
  obt_formation_rate_s: 1.6666666667e-7
  obt_turnover_rate_s: 8.3333333333e-7
  obt_day_night_enabled: true
  obt_day_multiplier: 1.5
  obt_night_multiplier: 0.5
  root_uptake_fraction_from_modelled_layer: 1.0
crops:
  active_crop: generic_crop
  lai_mode: constant
  edible_compartments_enabled: false
  external_lai_column: lai
  parameter_status: PROJECT_EXTENSION
  parameters:
    grass: &grass
      growth_start_doy: 90
      harvest_doy: 300
      max_lai: 3.5
      constant_lai: 1.5
      aboveground_biomass_kg_fresh_m2: 1.0
      edible_fraction: 1.0
      water_content_fraction_fresh: 0.80
      root_fraction_by_layer: [0.4, 0.6, 0.0]
      obt_formation_rate_s: 1.6666666667e-7
      biological_turnover_rate_s: 8.3333333333e-7
      edible_allocation_rate_s: 1.1574074074e-7
      harvest_loss_fraction: 0.05
      perennial: true
    leafy_vegetable:
      <<: *grass
      max_lai: 3.0
      aboveground_biomass_kg_fresh_m2: 0.8
      edible_fraction: 0.85
      perennial: false
    root_vegetable:
      <<: *grass
      harvest_doy: 280
      max_lai: 2.5
      aboveground_biomass_kg_fresh_m2: 1.2
      edible_fraction: 0.60
      water_content_fraction_fresh: 0.78
      root_fraction_by_layer: [0.2, 0.4, 0.4]
      perennial: false
    cereal:
      <<: *grass
      growth_start_doy: 110
      harvest_doy: 260
      max_lai: 4.5
      aboveground_biomass_kg_fresh_m2: 1.4
      edible_fraction: 0.45
      water_content_fraction_fresh: 0.15
      root_fraction_by_layer: [0.2, 0.4, 0.4]
      perennial: false
    pasture:
      <<: *grass
      max_lai: 4.0
      aboveground_biomass_kg_fresh_m2: 1.3
    generic_crop:
      <<: *grass
      max_lai: 3.0
      root_fraction_by_layer: [0.2, 0.4, 0.4]
      perennial: false
foodchain:
  enabled: false
  animal_mode: "off"
  parameter_status: MANUAL_DERIVED_PROVISIONAL
  feed_intake_kg_fresh_day: 50.0
  drinking_water_l_day: 50.0
  drinking_water_hto_bq_l: 0.0
  milk_production_l_day: 15.5
  animal_support_area_m2: 4000.0
  animal_products:
    beef:
      mode: continuous_herd_turnover
      turnover_rate_d-1: 0.002
      edible_meat_mass_kg_per_head: 200.0
  # Manual Eq. (82)-(105), converted from d-1 to s-1.
  hto_excretion_rate_s: 1.8518518519e-6
  obt_excretion_rate_s: 2.3148148148e-8
  milk_hto_transfer_rate_s: 4.5138888889e-7
  milk_obt_transfer_rate_s: 2.4305555556e-8
  obt_formation_rate_s: 1.2731481481e-8
  obt_turnover_rate_s: 1.7361111111e-7
  decay_rate_s: 1.7828335e-9
dose:
  enabled: false
  assessment_label: research screening dose
  active_age_group: adult
  coefficient_source: HPA-CRCE-004 Table 1 based on ICRP public intake coefficients
  coefficient_version: HPA-CRCE-004
  skin_to_inhalation_factor: 0.5
  drinking_water_hto_bq_l: 0.0
  age_groups:
    adult:
      hto_dose_coefficient_sv_bq: 1.8e-11
      obt_ingestion_dose_coefficient_sv_bq: 4.2e-11
      breathing_rate_m3_day: 20.0
      drinking_water_l_day: 2.0
      leafy_kg_day: 0.10
      root_crop_kg_day: 0.20
      grain_kg_day: 0.30
      milk_l_day: 0.30
      beef_kg_day: 0.10
    child:
      hto_dose_coefficient_sv_bq: 2.3e-11
      obt_ingestion_dose_coefficient_sv_bq: 5.7e-11
      breathing_rate_m3_day: 15.0
      drinking_water_l_day: 1.5
      leafy_kg_day: 0.07
      root_crop_kg_day: 0.15
      grain_kg_day: 0.20
      milk_l_day: 0.40
      beef_kg_day: 0.06
    infant:
      hto_dose_coefficient_sv_bq: 4.8e-11
      obt_ingestion_dose_coefficient_sv_bq: 1.2e-10
      breathing_rate_m3_day: 5.0
      drinking_water_l_day: 0.8
      leafy_kg_day: 0.02
      root_crop_kg_day: 0.05
      grain_kg_day: 0.05
      milk_l_day: 0.60
      beef_kg_day: 0.01
uncertainty:
  enabled: false
  sampling_method: latin_hypercube
  sample_count: 64
  random_seed: 20260724
  oat_relative_delta: 0.10
  parameters:
    - name: deposition_velocity
      path: atmosphere.deposition_velocity_m_s
      distribution: uniform
      low: 0.0025
      high: 0.0075
      active_when:
        - path: atmosphere.depletion.dry_deposition_enabled
          equals: true
    - name: wet_scavenging_a
      path: atmosphere.depletion.power_law_a_s
      distribution: uniform
      low: 5.0e-6
      high: 1.0e-4
      active_when:
        - path: atmosphere.depletion.wet_scavenging_mode
          equals: precipitation_power_law
    - name: wet_scavenging_b
      path: atmosphere.depletion.power_law_b
      distribution: uniform
      low: 0.6
      high: 1.0
      active_when:
        - path: atmosphere.depletion.wet_scavenging_mode
          equals: precipitation_power_law
    - name: lai
      path: crops.parameters.generic_crop.constant_lai
      distribution: uniform
      low: 0.5
      high: 4.0
      active_when:
        - path: crops.active_crop
          equals: generic_crop
        - path: crops.lai_mode
          equals: constant
    - name: pasture_max_lai
      path: crops.parameters.pasture.max_lai
      distribution: uniform
      low: 2.0
      high: 5.0
      active_when:
        - path: crops.active_crop
          equals: pasture
        - path: crops.lai_mode
          in: [piecewise_growth_stage, smooth_seasonal]
    - name: initial_soil_water
      path: soil.initial_water_m
      distribution: uniform
      low: 0.005
      high: 0.018
    - name: maximum_soil_water
      path: soil.maximum_water_m
      distribution: uniform
      low: 0.018
      high: 0.030
    - name: reemission_radiative_rate
      path: reemission.empirical_radiative_reference_fraction_h
      distribution: uniform
      low: 0.05
      high: 0.15
      active_when:
        - path: reemission.mode
          equals: ufotri_empirical
    - name: leaf_stomatal_resistance_day
      path: plant.leaf_stomatal_resistance_day_s_m
      distribution: uniform
      low: 200.0
      high: 800.0
      active_when:
        - path: plant.leaf_exchange_mode
          equals: bidirectional_resistance
    - name: leaf_characteristic_length
      path: plant.leaf_characteristic_length_m
      distribution: uniform
      low: 0.02
      high: 0.10
      active_when:
        - path: plant.leaf_exchange_mode
          equals: bidirectional_resistance
    - name: obt_formation_rate
      path: plant.obt_formation_rate_s
      distribution: uniform
      low: 8.3333333333e-8
      high: 3.3333333333e-7
    - name: adult_leafy_intake
      path: dose.age_groups.adult.leafy_kg_day
      distribution: uniform
      low: 0.05
      high: 0.20
      active_when:
        - path: dose.enabled
          equals: true
        - path: dose.active_age_group
          equals: adult
        - path: crops.active_crop
          equals: leafy_vegetable
    - name: feed_intake
      path: foodchain.feed_intake_kg_fresh_day
      distribution: uniform
      low: 30.0
      high: 70.0
      active_when:
        - path: foodchain.animal_mode
          equals: minimal_cow
    - name: beef_turnover
      path: foodchain.animal_products.beef.turnover_rate_d-1
      distribution: uniform
      low: 0.001
      high: 0.004
      active_when:
        - path: foodchain.animal_products.beef.mode
          equals: continuous_herd_turnover
    - name: adult_hto_dose_coefficient
      path: dose.age_groups.adult.hto_dose_coefficient_sv_bq
      distribution: uniform
      low: 1.6e-11
      high: 2.0e-11
      active_when:
        - path: dose.enabled
          equals: true
        - path: dose.active_age_group
          equals: adult
    - name: adult_obt_dose_coefficient
      path: dose.age_groups.adult.obt_ingestion_dose_coefficient_sv_bq
      distribution: uniform
      low: 3.5e-11
      high: 5.0e-11
      active_when:
        - path: dose.enabled
          equals: true
        - path: dose.active_age_group
          equals: adult
evapotranspiration:
  lai_shading_mode: radiation_term_only
reemission:
  mode: basic_mass_flux
  empirical_reference_evaporation_m_s: 2.0e-8
  empirical_reference_water_m: 0.010
  empirical_radiative_reference_fraction_h: 0.10
  empirical_diffusive_fraction_h: 0.01
  empirical_zt_half_life_h: 24.0
  empirical_ht_correction: 1.0
physics:
  water_density_kg_m3: 1000.0
  latent_heat_j_kg: 2450000.0
  psychrometric_constant_pa_k: 66.0
  tritium_decay_constant_s: 1.7828335e-9
  penman_aerodynamic_coefficient_w_m2_pa: 0.001
  fallback_shortwave_absorptivity: 0.77
  fallback_net_longwave_loss_w_m2: 50.0
numerics:
  mass_balance_relative_tolerance: 1.0e-6
  concentration_epsilon_m: 1.0e-12
synthetic_forcing:
  diurnal_period_hours: 24.0
  mean_temperature_k: 293.15
  temperature_amplitude_k: 7.0
  temperature_phase_hour: 8.0
  dewpoint_depression_k: 4.0
  mean_wind_m_s: 3.0
  wind_amplitude_m_s: 0.5
  wind_from_deg: 270.0
  maximum_net_radiation_w_m2: 550.0
  sunrise_hour: 6.0
  daylight_hours: 12.0
  rain_start_hour: 30.0
  rain_end_hour: 31.0
  rain_rate_m_s: 1.0e-6
outputs:
  grid_downwind_min_m: 100.0
  grid_downwind_max_m: 5000.0
  grid_downwind_count: 50
  grid_crosswind_min_m: -2000.0
  grid_crosswind_max_m: 2000.0
  grid_crosswind_count: 41
  representative_wind_m_s: 3.0
  representative_ambient_temperature_k: 293.15
  representative_plume_rise_distance_m: 1000.0

atmosphere:
  deposition_velocity_m_s: 0.005
  calm_wind:
    mode: minimum_effective_wind
    threshold_m_s: 0.5
    effective_wind_m_s: 0.5
    record_substitution: true
  depletion:
    enabled: true
    dry_deposition_enabled: true
    wet_scavenging_enabled: false
    wet_scavenging_mode: "off"
    method: segment_exponential
    mixing_height_m: 1000.0
    segments: 20
    wet_scavenging_rate_s: 0.0
    constant_scavenging_coefficient_s: 0.0
    # PROVISIONAL project parameterization; P is in mm h-1.
    power_law_a_s: 1.0e-5
    power_law_b: 0.8
    wet_deposition_footprint_area_m2: 1000000.0
  fixed_plume_rise_m: 15.0
  plume_rise_mode: fixed
  stability_mode: fixed
  stability_class: D
  surface_roughness_m: 0.1
  wind_reference_height_m: 10.0
  rural_wind_profile_exponent: 0.20
  reemission_feedback_area_m2: 1000000.0
  reemission_feedback_mode: area_source
  area_source_length_m: 1000.0
  area_source_width_m: 1000.0
  area_source_quadrature_x: 12
  area_source_quadrature_y: 12
  mixing_height_m: null
  mixing_layer_image_terms: 4
coupling:
  reemission_feedback_delay_s: 3600
  feedback_rectangle:
    length_m: 1000.0
    width_m: 1000.0
  feedback_area_m2: 1000000.0
soil:
  layer_model: single_top_5cm
  depth_m: 0.05
  initial_water_m: 0.010
  wilting_water_m: 0.004
  maximum_water_m: 0.020
  minimum_water_m: 0.0005
  infiltration_capacity_m_s: 0.00001
  runoff_enabled: false
  rain_hto_concentration_bq_m3: 0.0
  root_uptake_delay_seconds: 0
plant:
  lai: 1.5
  water_storage_m: 0.0005
  leaf_exchange_mode: "off"
  direct_leaf_uptake_enabled: false
  direct_leaf_velocity_m_s: 0.0
  # MANUAL_DERIVED_PROVISIONAL resistance parameterization.
  leaf_aerodynamic_resistance_s_m: 50.0
  leaf_boundary_resistance_s_m: 50.0
  leaf_stomatal_resistance_day_s_m: 400.0
  leaf_stomatal_resistance_night_s_m: 6000.0
  leaf_vpd_sensitivity_per_kpa: 0.5
  leaf_isotope_fractionation_liquid_to_vapour: 1.1
  obt_formation_rate_s: 1.6666666667e-7
  obt_turnover_rate_s: 8.3333333333e-7
  obt_day_night_enabled: true
  obt_day_multiplier: 1.5
  obt_night_multiplier: 0.5
  root_uptake_fraction_from_modelled_layer: 1.0
crops:
  active_crop: generic_crop
  lai_mode: constant
  edible_compartments_enabled: false
  external_lai_column: lai
  parameter_status: PROJECT_EXTENSION
  parameters:
    grass: &grass
      growth_start_doy: 90
      harvest_doy: 300
      max_lai: 3.5
      constant_lai: 1.5
      aboveground_biomass_kg_fresh_m2: 1.0
      edible_fraction: 1.0
      water_content_fraction_fresh: 0.80
      root_fraction_by_layer: [0.4, 0.6, 0.0]
      obt_formation_rate_s: 1.6666666667e-7
      biological_turnover_rate_s: 8.3333333333e-7
      edible_allocation_rate_s: 1.1574074074e-7
      harvest_loss_fraction: 0.05
      perennial: true
    leafy_vegetable:
      <<: *grass
      max_lai: 3.0
      aboveground_biomass_kg_fresh_m2: 0.8
      edible_fraction: 0.85
      perennial: false
    root_vegetable:
      <<: *grass
      harvest_doy: 280
      max_lai: 2.5
      aboveground_biomass_kg_fresh_m2: 1.2
      edible_fraction: 0.60
      water_content_fraction_fresh: 0.78
      root_fraction_by_layer: [0.2, 0.4, 0.4]
      perennial: false
    cereal:
      <<: *grass
      growth_start_doy: 110
      harvest_doy: 260
      max_lai: 4.5
      aboveground_biomass_kg_fresh_m2: 1.4
      edible_fraction: 0.45
      water_content_fraction_fresh: 0.15
      root_fraction_by_layer: [0.2, 0.4, 0.4]
      perennial: false
    pasture:
      <<: *grass
      max_lai: 4.0
      aboveground_biomass_kg_fresh_m2: 1.3
    generic_crop:
      <<: *grass
      max_lai: 3.0
      root_fraction_by_layer: [0.2, 0.4, 0.4]
      perennial: false
evapotranspiration:
  lai_shading_mode: radiation_term_only
reemission:
  mode: basic_mass_flux
  empirical_reference_evaporation_m_s: 2.0e-8
  empirical_reference_water_m: 0.010
  empirical_radiative_reference_fraction_h: 0.10
  empirical_diffusive_fraction_h: 0.01
  empirical_zt_half_life_h: 24.0
  empirical_ht_correction: 1.0
physics:
  water_density_kg_m3: 1000.0
  latent_heat_j_kg: 2450000.0
  psychrometric_constant_pa_k: 66.0
  tritium_decay_constant_s: 1.7828335e-9
  penman_aerodynamic_coefficient_w_m2_pa: 0.001
  fallback_shortwave_absorptivity: 0.77
  fallback_net_longwave_loss_w_m2: 50.0
numerics:
  mass_balance_relative_tolerance: 1.0e-6
  concentration_epsilon_m: 1.0e-12
synthetic_forcing:
  diurnal_period_hours: 24.0
  mean_temperature_k: 293.15
  temperature_amplitude_k: 7.0
  temperature_phase_hour: 8.0
  dewpoint_depression_k: 4.0
  mean_wind_m_s: 3.0
  wind_amplitude_m_s: 0.5
  wind_from_deg: 270.0
  maximum_net_radiation_w_m2: 550.0
  sunrise_hour: 6.0
  daylight_hours: 12.0
  rain_start_hour: 30.0
  rain_end_hour: 31.0
  rain_rate_m_s: 1.0e-6
outputs:
  grid_downwind_min_m: 100.0
  grid_downwind_max_m: 5000.0
  grid_downwind_count: 50
  grid_crosswind_min_m: -2000.0
  grid_crosswind_max_m: 2000.0
  grid_crosswind_count: 41
  representative_wind_m_s: 3.0
  representative_ambient_temperature_k: 293.15
  representative_plume_rise_distance_m: 1000.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cteas-ufotri"
version = "0.1.0"
description = "Minimal coupled HTO atmosphere-soil-plant model"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "xarray>=2024.1",
  "netCDF4>=1.7",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cteas-ufotri = "cteas_ufotri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

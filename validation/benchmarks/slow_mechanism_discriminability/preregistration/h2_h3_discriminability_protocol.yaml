      concentration_bq_ml_water: 52700.0
    washout:
      duration_h: 24.0
      concentration_bq_ml_water: 0.0
    second_exposure:
      start_h: 25.0
      duration_h: 1.0
      concentration_bq_ml_water: 52700.0
    final_exposure_end_h: 26.0
    simulation_length_days_after_final_exposure: 120
  D2_SECOND_PULSE_AFTER_72H:

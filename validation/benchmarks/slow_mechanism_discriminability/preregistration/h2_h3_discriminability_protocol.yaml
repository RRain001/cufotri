  h3_implementation_sha256: ee519e50006a32cd5d7387445bdf8794155188935f3276e7b26f9e92657f3f95

target_models:
  H2_SB1_FROZEN:
    source_mechanism_id: H2_PARALLEL_FAST_SLOW_RESIDUAL
    parameters:
      slow_capture_fraction:
        value: 0.001
        unit: "1"
      slow_release_rate_s:
        value: 1.0e-6
        unit: s-1
    selected_from_sb4: false
    refit_allowed: false
  H3_SB1_FROZEN:
    source_mechanism_id: H3_REVERSIBLE_FAST_SLOW_EXCHANGE
    parameters:
      fast_to_slow_rate_s:
        value: 1.0e-7
        unit: s-1
      slow_to_fast_rate_s:
        value: 1.0e-6
        unit: s-1
    selected_from_sb4: false
    refit_allowed: false

observables:
  primary:
    id: total_plant_body_tfwt
    model_field: plant_body_tfwt_bq_l_water
    unit: Bq L-1 tissue water
    experimentally_observable: true
    classification_role: PRIMARY_ONLY
  secondary:
    - id: fast_pool_tfwt
      model_field: plant_fast_tfwt_inventory_bq_m2
      experimentally_observable: false
      classification_role: INTERPRETATION_ONLY
    - id: slow_pool_tfwt
      model_field: plant_slow_tfwt_inventory_bq_m2
      experimentally_observable: false
      classification_role: INTERPRETATION_ONLY
  latent_pool_used_for_classification: false

controlled_conditions:
  status: SYNTHETIC_CONTROLLED_CONDITIONS
  simulation_start_local: 2001-01-01T09:30:00+09:00
  timezone: Asia/Seoul
  temperature_c: 25.0
  relative_humidity_percent: 70.0
  wind_speed_m_s: 0.5
  surface_pressure_pa: 101325.0
  shortwave_down_w_m2: 200.0
  longwave_down_w_m2: 350.0
  total_cloud_cover_fraction: 0.25
  precipitation_mm_interval: 0.0
  background_air_moisture_hto_bq_ml_water: 0.0
  lai: 4.0
  leaf_stomatal_resistance_day_s_m: 800.0
  leaf_characteristic_length_m: 0.10
  plant_body_water_storage_m: 0.0009826
  exposure_body_dry_g_m2: 477.8
  harvest_body_dry_g_m2: 946.3
  harvest_pod_fresh_g_m2: 1069.9
  harvest_pod_dry_g_m2: 340.6
  pod_process_used_for_classification: false
  exchange_state: CONSTANT_DAYTIME
  time_step_minutes: 5
  high_exposure_concentration_bq_ml_water: 52700.0
  low_exposure_concentration_bq_ml_water: 5270.0
  air_conversion_formula: >-
    air_hto_bq_m3 =
    air_moisture_hto_bq_ml_water * actual_vapour_density_g_m3

experiment_duration_contract:
  minimum_discriminating_experiment:
    design_id: D3_SHORT_STEP_24H
    exposure_duration_h: 24
    post_exposure_observation_h: 120
    total_elapsed_duration_h: 144
    approximate_total_duration_days: 6
    required_sampling_hours_after_final_exposure: [0.2, 48, 120]
  extended_diagnostic_experiment:
    required: false
    maximum_followup_days_after_final_exposure: 120
    purposes:
      - LONG_TAIL_BEHAVIOUR
      - MODEL_ANOMALY_DIAGNOSIS
      - OPTIONAL_OBT_OR_ORGAN_TRANSFER_ANALYSIS

designs:
  D0_SINGLE_PULSE_BASELINE:

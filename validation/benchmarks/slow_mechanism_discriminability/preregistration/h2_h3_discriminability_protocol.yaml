    simulation_length_days_after_final_exposure: 120

sampling:
  reference: FINAL_EXPOSURE_END
  candidate_hours_after_final_exposure:
    [0.2, 0.5, 1, 3, 6, 12, 24, 48, 72, 120, 168, 336, 504, 768]
  exposure_period_hours_from_first_exposure_start:
    [1, 6, 12, 24, 48, 72]
  exposure_period_designs: [D3_SHORT_STEP_24H, D4_LONG_STEP_72H]
  frozen_before_execution: true
  optimization:
    algorithm: DETERMINISTIC_GREEDY_WORST_NOISE_ACCURACY
    minimum_sample_count: 3
    maximum_sample_count: 8
    first_point_rule: MAXIMUM_DELTA_LOG10
    subsequent_point_rule: >-
      add the unused candidate time that maximizes the worst classification
      accuracy across both truth models and all frozen noise levels
    tie_breaker: EARLIEST_TIME
    objective_noise_cv: 0.20
    must_meet_all_frozen_accuracy_thresholds: true

existing_evidence_analysis:
  sb1_hours: [0.2, 1, 24, 120, 336, 936, 1608, 2280]
  sb4_hours: [0.2, 1, 24, 120, 336, 768, 1368]
  parameter_refit: false
  noise_cv: [0.10, 0.20, 0.30]
  normalized_difference: >-
    absolute H2-H3 prediction difference divided by the stated
    coefficient-of-variation times the geometric-mean prediction
  allowed_conclusions:
    - SUFFICIENT_TO_SELECT_H2
    - SUFFICIENT_TO_SELECT_H3
    - INSUFFICIENT_TO_SELECT_H2_OR_H3

pointwise_metrics:
  delta_log10: abs(log10(H2) - log10(H3))
  ratio: max(H2,H3) / min(H2,H3)
  signed_difference: H2 - H3
  relative_difference: abs(H2-H3) / geometric_mean(H2,H3)
  strong_separation_delta_log10_minimum: 0.30
  moderate_separation_delta_log10_minimum: 0.15

monte_carlo:
  replicates_per_truth_model_design_noise: 1000
  truth_models: [H2_SB1_FROZEN, H3_SB1_FROZEN]
  noise_distribution: LOGNORMAL_MEAN_ONE
  coefficient_of_variation: [0.10, 0.20, 0.30]
  random_seed: 20260727
  parameter_refit: false
  classifier: MINIMUM_LOG10_RMSE_TO_FROZEN_PREDICTION
  tie_breaker: INCONCLUSIVE
  latent_pool_input_allowed: false

design_success_criteria:
  both_truth_models_must_pass: true
  classification_accuracy_minimum:
    cv_0_10: 0.90
    cv_0_20: 0.80
    cv_0_30: 0.70
  strong_pointwise_separation:
    delta_log10_minimum: 0.30
    minimum_time_point_count: 2
  exposure_concentration_robustness_required: true
  relative_humidity_robustness_required: true
  wind_speed_robustness_required: true
  stomatal_resistance_robustness_required: true
  all_runs_finite_nonnegative_required: true
  all_runs_mass_conservative_required: true
  latent_pool_observation_allowed: false
  passing_status: DISCRIMINATING_DESIGN_SUPPORTED
  failing_status: SYNTHETIC_DESIGN_NOT_ROBUST

robustness:
  evaluation_mode: ONE_FACTOR_AT_A_TIME
  top_design_count: 3
  exposure_concentration_multiplier: [0.8, 1.0, 1.2]
  relative_humidity_percent: [60.0, 70.0, 80.0]
  wind_speed_m_s: [0.2, 0.5, 1.0]
  stomatal_resistance_multiplier: [0.8, 1.0, 1.2]
  slow_process_parameter_refit: false
  required_interpretation: >-
    discrimination must persist under uptake-related perturbations and be
    attributed to slow-pool structural dynamics rather than uptake magnitude

local_sensitivity:
  output: total_plant_body_tfwt
  coordinate: LOG_PARAMETER
  fractional_step: 0.01
  boundary_rule: FORWARD_DIFFERENCE_WITHIN_FROZEN_BOUNDS
  interior_rule: CENTRAL_DIFFERENCE_WITHIN_FROZEN_BOUNDS
  diagnostics:
    - rank
    - condition_number
    - maximum_absolute_column_correlation
    - fisher_information_determinant
    - h2_h3_model_output_distance
  allowed_conclusions:
    - CURRENT_DATA_INSUFFICIENT
    - SYNTHETIC_DESIGN_PROMISING
    - SYNTHETIC_DESIGN_NOT_ROBUST
  global_structural_identifiability_claim: false

output_contract:
  reports_root: >-
    validation/benchmarks/slow_mechanism_discriminability/reports
  data_root: >-
    validation/benchmarks/slow_mechanism_discriminability/results
  required_outputs:
    - existing_sb1_discriminability.csv
    - existing_sb4_discriminability.csv
    - existing_evidence_discriminability_report.md
    - synthetic_design_predictions.csv
    - synthetic_design_ranking.md
    - monte_carlo_classification.csv
    - monte_carlo_classification_report.md
    - minimum_sampling_design.csv
    - sampling_design_tradeoff.csv
    - sampling_optimization_report.md
    - design_robustness_matrix.csv
    - robustness_report.md
    - h2_local_sensitivity.csv
    - h3_local_sensitivity.csv
    - model_output_distance.csv
    - structural_discriminability_report.md
  experiment_specification: >-
    docs/v3/benchmarks/h2_h3_minimum_discriminating_experiment_spec.md
  final_report: >-
    docs/v3/benchmarks/h2_h3_slow_mechanism_discriminability_report.md

failure_rules:
  - H2 or H3 parameters differ from the bound SB1 frozen contract
  - any H2 or H3 slow-process parameter is refitted
  - any parameter bound is expanded
  - the candidate sampling grid or noise levels change after execution
  - a latent fast or slow pool is used by the classifier
  - synthetic output is labelled experimental or empirical evidence
  - formal src or root configs files change
  - the trusted external evidence registry changes
  - the production physics gate is unblocked

mapping_id: D3_UFOTRI_MANUAL_DATA_FIELD_MAPPING_V1
status: FROZEN_PRE_LAB
created_on: '2026-08-03'
purpose: >-
  Map the physical data requirements stated or implied by ufotri_manual.md to
  the frozen D3 laboratory handoff without changing the D3 protocol, model
  parameters, classifier thresholds, or external-evidence gate.

source:
  file: ufotri_manual.md
  source_commit: b885ff80872edd33c0e8657ef44948b3aae8d1ca
  source_sha256: 82c7c7f07975553a51e7ba1666a912f80096e5af4fc138aba6f45a120e6d3562
  source_status: READ_ONLY_CONVERTED_HISTORICAL_MANUAL
  source_caveat: >-
    The Markdown source is a historical document conversion. OCR, table
    layout, unit formatting, and equation numbering are not silently repaired.

manual_scope:
  - section: '2.2.2'
    title: Plant/Atmosphere Exchange Processes
    evidence_anchors: 'Equations (7)-(24); text on PAR, soil water, plant type and day/night resistance'
  - section: '2.2.3'
    title: Soil/Atmosphere Exchange Processes and Transport in Soil
    evidence_anchors: 'Equations (33)-(37); soil type, moisture, layers, transport and root uptake'
  - section: '2.2.4'
    title: Re-emission
    evidence_anchors: 'Equations (38)-(44-2); top 5 cm, evapotranspiration, rain and re-emission'
  - section: '2.2.5'
    title: Uptake of HTO by the Plant Root System
    evidence_anchors: 'Top 5 cm, 30 cm root depth, root distribution and uptake fractions'
  - section: '2.2.6'
    title: Exchangeable and Non-Exchangeable Tritium
    evidence_anchors: 'Plant HTO/OBT distinction and OBT uptake/loss discussion'
  - section: '3.3.3'
    title: Vegetables
    evidence_anchors: 'Equations (65)-(66); plant HTO and plant OBT compartments'
  - section: '5.2.1'
    title: Site description and release details
    evidence_anchors: 'Canada 1987 field geometry, soil, moisture and meteorological records'
  - section: '5.2.2'
    title: Input parameters
    evidence_anchors: 'Table 3; release, meteorology, soil, plant mass, LAI and resistance examples'
  - section: '5.2.3'
    title: Comparison of measured and calculated results
    evidence_anchors: 'Figures 21-28; air, soil and vegetation-water observations and limitations'
  - section: '5.3'
    title: ITER benchmark calculations
    evidence_anchors: 'Table 8 and text on HT/HTO, release height, meteorology, soil and vegetation'

classification_enum:
  - MANUAL_EXPLICIT
  - MANUAL_DERIVED
  - D3_DESIGN_SPECIFIC
  - MODERN_QA_REQUIRED
  - NOT_APPLICABLE_CONTROLLED_CHAMBER
  - UNRESOLVED_NO_SOURCE

action_enum:
  - KEEP
  - CLARIFY
  - ADD
  - NOT_APPLICABLE
  - DEFER_UNRESOLVED

requirement_enum:
  - required
  - optional
  - not_applicable
  - defer_unresolved

controlled_chamber_rules:
  wind_speed_to_mixing_velocity:
    relation: ANALOGUE_ONLY
    physical_equivalence_claim: false
  net_solar_radiation_to_par_or_illumination:
    relation: CONTROLLED_LIGHT_RECORD
    physical_equivalence_claim: false
  wind_direction: NOT_APPLICABLE
  pasquill_stability: NOT_APPLICABLE
  release_height: >-
    Record inlet geometry if useful for engineering traceability, but do not
    treat it as an atmospheric release-height input.
  precipitation: >-
    Not applicable for the dry controlled-chamber design; retain an event or
    wet-leaf flag if a wet-leaf scenario is deliberately run.

frozen_d3_boundary:
  exposure_medium: HTO_IN_CHAMBER_AIR_MOISTURE
  exposure_setpoint_bq_per_ml_air_moisture_water: 5270
  exposure_duration_h: 24
  post_exposure_followup_h: 120
  primary_sampling_times_h: [0.2, 48, 120]
  diagnostic_sampling_times_h: [1, 6, 24, 72]
  biological_replicates_per_primary_time: 5
  primary_endpoint: COMBINED_STEM_AND_LEAF_TFWT
  primary_endpoint_unit: Bq/L tissue water
  roots_in_primary_endpoint: false
  pods_in_primary_endpoint: false
  seeds_in_primary_endpoint: false
  planning_lod_bq_per_l_tissue_water: 250
  planning_lod_status: PROJECT_PLANNING_TARGET_NOT_CONFIRMED_CAPABILITY
  planning_total_relative_uncertainty_percent_maximum: 20
  lab_feasibility_status: AWAITING_LAB_CONFIRMATION
  real_experiment: NOT_EXECUTED
  real_external_evidence: false
  formal_v3_physics: NOT_STARTED
  v3_physics_start_gate: BLOCKED_EXTERNAL_EXPERIMENT_OR_FIELD_DATA

authorization_boundary:
  model_code_change_authorized: false
  formal_root_config_change_authorized: false
  h2_h3_parameter_change_authorized: false
  classifier_threshold_change_authorized: false
  primary_sampling_time_change_authorized: false
  replicate_count_change_authorized: false
  synthetic_regeneration_authorized: false
  trusted_registry_change_authorized: false
  v3_tag_creation_authorized: false
  d4_d5_execution_authorized: false
  formal_h2_h3_selection_authorized: false

fields:
  - field_id: tritium_chemical_form
    display_name: Tritium chemical form
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2; 5.3 Appendix B §1; Table 8'
    manual_term: HT/HTO
    manual_unit: chemical form
    d3_field: exposure_medium
    d3_unit: controlled-chamber medium definition
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: exposure_medium'
    action: CLARIFY
    value_status: D3_FROZEN_MEDIUM_IS_HTO_IN_CHAMBER_AIR_MOISTURE
    notes: >-
      The D3 record must say air-moisture HTO. It must not be interpreted as
      culture water, irrigation water or a liquid reservoir concentration.

  - field_id: air_moisture_hto_concentration
    display_name: HTO concentration in chamber air moisture
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2; 5.2.2 Table 3; 5.2.3 Figures 25-28'
    manual_term: specific HTO concentration in air/vegetation water
    manual_unit: Bq per volume or mass of water, as defined by the record
    d3_field: air_moisture_hto_bq_per_ml_water
    d3_unit: Bq/mL air-moisture water
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: air_moisture_hto_bq_per_ml_water'
    action: CLARIFY
    value_status: D3_FROZEN_SETPOINT_AND_MEASURED_TIME_SERIES
    notes: 5270 Bq/mL must retain the air-moisture-water basis in every handoff.

  - field_id: release_rate
    display_name: Release rate
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '5.2.2 Table 3; 5.3 Appendix B §1'
    manual_term: release rate
    manual_unit: Bq/s in the Canada case
    d3_field: null
    d3_unit: null
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: NONE
    action: NOT_APPLICABLE
    value_status: MANUAL_CASE_PARAMETER_NOT_D3_VALUE
    notes: A chamber setpoint time series is not a source-term release rate.

  - field_id: total_released_activity
    display_name: Total released activity or release quantity
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '5.3 Appendix B §1; Table 8'
    manual_term: release quantity
    manual_unit: 100 g in the benchmark appendix; no automatic Bq conversion
    d3_field: null
    d3_unit: null
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: NONE
    action: NOT_APPLICABLE
    value_status: MANUAL_CASE_PARAMETER_NOT_D3_VALUE
    notes: Do not convert or reuse the benchmark release quantity for D3.

  - field_id: release_duration
    display_name: Release or exposure duration
    category: [MANUAL_EXPLICIT]
    manual_reference: '5.2.2 Table 3; 5.3 Appendix B §1'
    manual_term: duration of release
    manual_unit: time
    d3_field: exposure_duration_h
    d3_unit: h
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'quality_control_checklist.yaml: minimum_schedule.exposure_duration_h'
    action: CLARIFY
    value_status: D3_FROZEN_VALUE_SEPARATE_FROM_MANUAL_CASE_VALUES
    notes: Manual case durations are examples; D3 duration is independently frozen at 24 h.

  - field_id: release_height
    display_name: Atmospheric release height
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '5.2.2; 5.3 Appendix B §1 and Table 8'
    manual_term: release height
    manual_unit: m
    d3_field: chamber_inlet_geometry_if_recorded
    d3_unit: engineering geometry, not atmospheric source height
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: 'chamber_forcing_template.csv: measurement_location'
    action: NOT_APPLICABLE
    value_status: MANUAL_CASE_PARAMETER_NOT_D3_VALUE
    notes: Inlet geometry may be recorded but is not a physical release-height analogue.

  - field_id: source_geometry
    display_name: Outdoor point or area source geometry
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '2.2.1; Figures 3-4; 5.2.1 Figure 20'
    manual_term: area source and field layout
    manual_unit: m and plan geometry
    d3_field: chamber_geometry_metadata
    d3_unit: chamber engineering metadata
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: 'requested_file_contract.yaml: exposure and semantics groups'
    action: NOT_APPLICABLE
    value_status: MANUAL_FIELD_GEOMETRY_NOT_D3_PHYSICS_INPUT
    notes: Do not splice field source geometry into the controlled-chamber experiment.

  - field_id: wind_direction
    display_name: Wind direction
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '2.2.1; 5.2.1; 5.2.2 Table 3'
    manual_term: wind direction
    manual_unit: degree
    d3_field: null
    d3_unit: null
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: NONE
    action: NOT_APPLICABLE
    value_status: CONTROLLED_CHAMBER_NOT_A_WIND_FIELD
    notes: Never fill this field with a guessed chamber direction.

  - field_id: wind_speed
    display_name: Outdoor wind speed
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2 Equations (17)-(24); 5.2.2 Table 3'
    manual_term: wind speed / wind velocity
    manual_unit: m/s
    d3_field: mixing_velocity_m_s
    d3_unit: m/s
    requirement: required
    controlled_chamber_mapping: analogue_non_equivalent
    existing_template_location: 'chamber_forcing_template.csv: mixing_velocity_m_s'
    action: CLARIFY
    value_status: D3_CONTROLLED_MIXING_RECORD
    notes: Chamber mixing velocity is an operational analogue only, not outdoor wind.

  - field_id: stability_class
    display_name: Pasquill-Gifford stability class
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '2.2.2 Equations (22)-(24); 5.2.2 Table 3; 5.3 Table 8'
    manual_term: stability class / Pasquill notation
    manual_unit: A-F category
    d3_field: null
    d3_unit: null
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: NONE
    action: NOT_APPLICABLE
    value_status: OUTDOOR_DISPERSION_FIELD
    notes: No stability class should be invented for the chamber.

  - field_id: air_temperature
    display_name: Air temperature
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2 Equations (10)-(11); 5.2.1; 5.2.2 Table 3'
    manual_term: temperature / ambient temperature
    manual_unit: C or K, with recorded unit
    d3_field: temperature_c
    d3_unit: deg C
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: temperature_c'
    action: KEEP
    value_status: MEASURED_D3_FORCING
    notes: Preserve timestamp, instrument and quality flag with every record.

  - field_id: relative_humidity
    display_name: Relative humidity or water-vapour state
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2 Equations (10)-(11); 5.2.1'
    manual_term: relative humidity / vapour pressure state
    manual_unit: percent or pressure, as recorded
    d3_field: relative_humidity_percent
    d3_unit: percent
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: relative_humidity_percent'
    action: KEEP
    value_status: MEASURED_D3_FORCING
    notes: Do not silently convert a pressure record without retaining the source unit.

  - field_id: net_solar_radiation
    display_name: Net solar radiation
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.4 Equation (38); 5.2.1; 5.2.2 Table 3'
    manual_term: net solar radiation / radiation balance
    manual_unit: W/m2
    d3_field: par_or_radiation_value
    d3_unit: value plus explicit PAR or W/m2 unit
    requirement: required
    controlled_chamber_mapping: analogue_non_equivalent
    existing_template_location: 'chamber_forcing_template.csv: par_or_radiation_value and par_or_radiation_unit'
    action: CLARIFY
    value_status: CONTROLLED_ILLUMINATION_RECORD
    notes: PAR or controlled illumination is not asserted to equal outdoor net radiation.

  - field_id: par_day_night_state
    display_name: PAR and day/night state
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2; 2.2.4; text on PAR and daylight/night period'
    manual_term: PAR conditions; daylight and night period
    manual_unit: PAR unit or categorical state
    d3_field: par_or_radiation_value_and_experiment_phase
    d3_unit: recorded value/unit and phase
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: par_or_radiation_value, experiment_phase'
    action: CLARIFY
    value_status: D3_LIGHTING_METADATA
    notes: Retain a phase/event record; do not infer light state from clock time alone.

  - field_id: precipitation
    display_name: Precipitation or wet-leaf event
    category: [MANUAL_EXPLICIT, NOT_APPLICABLE_CONTROLLED_CHAMBER]
    manual_reference: '2.2.2 text on precipitation; 2.2.4; 5.2.1'
    manual_term: precipitation / rain event
    manual_unit: mm or event flag
    d3_field: precipitation_mm_and_wet_leaf_event_flag
    d3_unit: mm per interval and categorical event flag
    requirement: not_applicable
    controlled_chamber_mapping: not_applicable
    existing_template_location: 'chamber_forcing_template.csv: precipitation_mm and event_flag'
    action: CLARIFY
    value_status: D3_DRY_CHAMBER_EXPECTS_ZERO_NOT_UNMEASURED
    notes: Retain zero/event evidence; a wet-leaf scenario requires separate authorization.

  - field_id: measurement_height
    display_name: Meteorological measurement height or location
    category: [MANUAL_EXPLICIT]
    manual_reference: '5.2.1; 5.2.2; Figures 20, 25 and 26'
    manual_term: instrument measurement height
    manual_unit: m and location metadata
    d3_field: measurement_height_or_location
    d3_unit: m or controlled chamber location
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: measurement_height_m and measurement_location'
    action: ADD
    value_status: MODERN_TRACEABILITY_FOR_D3_FORCING
    notes: Manual results show that height can affect observed gradients; location must be explicit.

  - field_id: plant_type
    display_name: Plant type
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2; 3.3.3; 5.3 text on green vegetables'
    manual_term: type of plant / plant species
    manual_unit: categorical taxon or crop
    d3_field: crop_and_cultivar
    d3_unit: soybean cultivar identifier
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'tfwt_sample_template.csv and biomass_template.csv: crop, cultivar'
    action: KEEP
    value_status: D3_DESIGN_SOYBEAN
    notes: Green-vegetable and single-plant assumptions in the manual do not define a soybean cultivar.

  - field_id: plant_water_mass
    display_name: Plant water mass
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2; 5.2.2 Table 3'
    manual_term: anorganic plant water content / plant water
    manual_unit: g in the Canada case; retain measured basis
    d3_field: tissue_water_mass_g_or_volume_ml
    d3_unit: g and/or mL extracted tissue water
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'tfwt_sample_template.csv and biomass_template.csv: tissue-water fields'
    action: KEEP
    value_status: MANUAL_CASE_VALUE_NOT_D3_DEFAULT
    notes: The manual example of 200 g is not a D3 plant-mass requirement.

  - field_id: organic_plant_matter
    display_name: Organic plant matter
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2; 3.3.3; 5.2.2 Table 3'
    manual_term: organic plant matter / organic plant compartment
    manual_unit: g or kg per area, with basis
    d3_field: dry_mass_and_optional_organic_mass
    d3_unit: g sample basis
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'biomass_template.csv: dry_mass_g and organ mass fields'
    action: KEEP
    value_status: MANUAL_CASE_VALUE_NOT_D3_DEFAULT
    notes: Preserve wet/dry basis; do not import the manual 100 g case value.

  - field_id: leaf_area_index
    display_name: Leaf area index
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2 Equation (14); 2.2.4 Equation (40); 5.2.2 Table 3'
    manual_term: leaf area index L
    manual_unit: m2/m2
    d3_field: leaf_area_index
    d3_unit: m2/m2
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'biomass_template.csv: leaf_area_index'
    action: CLARIFY
    value_status: MANUAL_EXAMPLE_OR_CASE_PARAMETER
    notes: Manual LAI=3 is a case/example value and is not the D3 required value.

  - field_id: daytime_stomatal_resistance
    display_name: Daytime stomatal or diffusion resistance
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2 Equations (9)-(14); Table 3'
    manual_term: diffusion resistance during the day for a single leaf
    manual_unit: s/cm in Table 3; model equations also use s/m
    d3_field: daytime_stomatal_resistance_if_measured
    d3_unit: recorded value and unit
    requirement: optional
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: plant_material and analytical metadata'
    action: CLARIFY
    value_status: MANUAL_EXAMPLE_OR_CASE_PARAMETER
    notes: The manual 4 s/cm value must not be adopted as a D3 parameter without independent evidence.

  - field_id: nighttime_epidermal_resistance
    display_name: Nighttime epidermal or diffusion resistance
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.2 text on closed stomata and Table 3'
    manual_term: diffusion resistance during the night for a single leaf
    manual_unit: s/cm in Table 3; model equations also use s/m
    d3_field: nighttime_epidermal_resistance_if_measured
    d3_unit: recorded value and unit
    requirement: optional
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: plant_material and analytical metadata'
    action: CLARIFY
    value_status: MANUAL_EXAMPLE_OR_CASE_PARAMETER
    notes: The manual 60 s/cm value is an example/case value, not a D3 default.

  - field_id: soil_type
    display_name: Soil or substrate type
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.3; 5.2.1; 5.3 Table 8'
    manual_term: soil type / sandy loam
    manual_unit: categorical type and laboratory description
    d3_field: substrate
    d3_unit: material description and batch
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'biomass_template.csv: substrate'
    action: ADD
    value_status: D3_MATERIAL_METADATA
    notes: A chamber substrate is not automatically the manual sandy-loam case.

  - field_id: soil_organic_content
    display_name: Soil organic content
    category: [MANUAL_EXPLICIT]
    manual_reference: '5.2.1; 5.3 Table 8'
    manual_term: organic part / organic content
    manual_unit: percent
    d3_field: substrate_organic_content_percent_if_measured
    d3_unit: percent
    requirement: optional
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: plant_material and root pathway groups'
    action: ADD
    value_status: D3_MATERIAL_METADATA_IF_MEASURED
    notes: Record as measured or NOT_AVAILABLE; do not use the field-case values as defaults.

  - field_id: volumetric_soil_water_content
    display_name: Volumetric soil or substrate water content
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.3 Equations (33)-(37); 2.2.4; 5.2.2 Table 3'
    manual_term: soil water content / actual water content
    manual_unit: percent or m3/m3 with basis
    d3_field: substrate_moisture_time_series
    d3_unit: percent or m3/m3 with basis and timestamp
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'chamber_forcing_template.csv: event/forcing metadata; requested_file_contract.yaml: root_pathway_and_controls'
    action: ADD
    value_status: MANUAL_EXAMPLE_OR_CASE_PARAMETER
    notes: Manual 20% is a case/example value; D3 needs a measured time series or explicit missing status.

  - field_id: soil_layer_depths
    display_name: Soil layer depths
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.4; 2.2.5; 3.3.3 Figure 13'
    manual_term: top 5 cm and root layers up to 30 cm
    manual_unit: cm
    d3_field: substrate_layer_depths_cm
    d3_unit: cm
    requirement: optional
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: root_pathway_and_controls'
    action: ADD
    value_status: D3_ROOT_DIAGNOSTIC_METADATA
    notes: Required when root or substrate pathways are not experimentally excluded.

  - field_id: root_distribution
    display_name: Root distribution and uptake zone
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.3; 2.2.5; 5.2.3 limitation paragraph'
    manual_term: root distribution and uptake rates by soil layer
    manual_unit: layer fractions or measured profile
    d3_field: root_pathway_status_and_root_distribution_if_measured
    d3_unit: categorical status and optional layer data
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: root_pathway_and_controls'
    action: ADD
    value_status: D3_CONTROL_OR_DIAGNOSTIC
    notes: The primary endpoint excludes roots, but uncontrolled root HTO remains a confounder.

  - field_id: soil_hto_concentration
    display_name: HTO concentration in soil or substrate water
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.3; 2.2.4; 5.2.3 Figures 23-24'
    manual_term: HTO in soil / specific HTO concentration in water
    manual_unit: recorded activity concentration and water basis
    d3_field: substrate_hto_status_and_measurement_if_available
    d3_unit: status plus activity concentration/unit
    requirement: required
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: root_pathway_and_controls'
    action: ADD
    value_status: D3_ROOT_PATHWAY_CONTROL
    notes: Zero, measured, or NOT_AVAILABLE status must be explicit; no silent assumption of zero.

  - field_id: drainage_or_downward_flux
    display_name: Drainage, infiltration or downward soil-water flux
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.3 Equations (34)-(37); 2.2.4 Equation (44-1)'
    manual_term: downward flux / transport into deeper layers
    manual_unit: flux or percent fraction with basis
    d3_field: substrate_drainage_or_downward_flux_if_measured
    d3_unit: recorded value and unit
    requirement: optional
    controlled_chamber_mapping: direct
    existing_template_location: 'requested_file_contract.yaml: root_pathway_and_controls'
    action: ADD
    value_status: D3_ROOT_DIAGNOSTIC_METADATA
    notes: The field is not needed if a documented root-pathway exclusion is verified.

  - field_id: soil_reemission_rate
    display_name: Soil HTO re-emission rate
    category: [MANUAL_EXPLICIT]
    manual_reference: '2.2.4 Equation (44-1) and (44-2)'
    manual_term: REEM, DIFF and total re-emission rate
    manual_unit: percent per unit time

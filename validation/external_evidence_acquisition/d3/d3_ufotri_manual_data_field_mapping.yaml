summary_contract:
  primary_endpoint_semantics: >-
    The legacy classifier label total plant-body TFWT is mapped for this handoff
    to the explicit measured combined stem-and-leaf TFWT sample definition.
  excluded_from_primary_endpoint: [roots, pods, seeds]
  manual_example_values_not_d3_requirements:
    - 'LAI = 3 m2/m2'
    - 'daytime resistance = 4 s/cm'
    - 'nighttime resistance = 60 s/cm'
    - 'soil water content = 20%'
  source_ambiguity_policy: SOURCE_TEXT_AMBIGUOUS_OR_OCR_REVIEW_REQUIRED
  unresolved_policy: DO_NOT_CONVERT_TO_PROJECT_ASSUMPTION
  future_lab_status: AWAITING_LAB_CONFIRMATION

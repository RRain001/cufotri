baseline:
  main_sha: d24aa03b00dcb586a2d93e678f42cb7853b7c078
  profile: v3_frozen_baseline
  runtime_default_changed: false

contract:
  public_module: cteas_ufotri.plant.mass_basis_v3_1
  mass_basis:
    - fresh_mass
    - dry_mass
    - water_mass
    - hydrogen_mass
  tissue_scope:
    typed: true
    custom_scope_requires_identifier: true
  area_basis:
    typed: true
    custom_scope_requires_identifier: true
    no_implicit_area_conversion: true
  provenance:
    required_fields:
      - source_id
      - source_locator
      - revision
  conversion_status:
    - not_requested
    - identity_only
    - evidence_declared
    - blocked_missing_evidence
  conversion_evidence_binding:
    evidence_declared_requires_evidence_id: true
    evidence_id_forbidden_for_other_statuses: true
    supplied_evidence_id_must_match_declared_id: true
    evidence_declared_is_physical_validation: false

comparison_policy:
  direct_comparison_requires:
    - identical_mass_basis
    - identical_tissue_scope
    - identical_area_basis
  cross_mass_basis:
    default: FAIL_CLOSED
    explicit_source_target_pairs_required: true
    evidence_tissue_scope_must_match: true
    evidence_area_basis_must_match: true
    provenance_required: true
    numerical_conversion_implemented: false
    inferred_conversion_factor_forbidden: true
  cross_tissue_scope:
    default: FAIL_CLOSED
  cross_area_basis:
    default: FAIL_CLOSED

conversion_evidence_contract:
  purpose: >-
    Record that a proposed cross-basis relation has explicit provenance,
    matching tissue/area scope, and explicit matched source/target measurement
    pairs. It does not contain or calculate a conversion factor.
  paired_measurement_representation: explicit_source_target_pair_records
  minimum_pair_count: 1
  pair_id_unique: true
  source_target_measurement_ids_distinct_within_pair: true
  measurement_record_reuse_across_pairs_forbidden: true
  tissue_scope_bound: true
  area_basis_bound: true
  source_target_direction_must_match: true
  declared_contract_evidence_id_must_match: true
  parameter_activation: false
  calibration: false

isolation:
  solver_equations_changed: false
  pipeline_changed: false

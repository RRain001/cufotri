contract:
  public_module: cteas_ufotri.plant.mass_basis_v3_1
  mass_basis:
    - fresh_mass
    - dry_mass
    - water_mass
    - hydrogen_mass
  tissue_scope:
    typed: true
    custom_scope_requires_identifier: true
  area_basis:
    typed: true
    custom_scope_requires_identifier: true
    no_implicit_area_conversion: true
  provenance:
    required_fields:
      - source_id
      - source_locator
      - revision
  conversion_status:
    - not_requested
    - identity_only
    - evidence_declared
    - blocked_missing_evidence
  conversion_evidence_binding:
    evidence_declared_requires_evidence_id: true
    evidence_id_forbidden_for_other_statuses: true
    supplied_evidence_id_must_match_declared_id: true
    evidence_declared_is_physical_validation: false

comparison_policy:
  direct_comparison_requires:
    - identical_mass_basis
    - identical_tissue_scope
    - identical_area_basis
  same_mass_basis:
    direct_comparison_api: require_direct_comparison
    conversion_proposal_result_without_cross_basis_state: identity_only
    conversion_proposal_supplied_evidence_forbidden: true
    conversion_proposal_evidence_declared_state_forbidden: true
  cross_mass_basis:
    default: FAIL_CLOSED
    explicit_source_target_pairs_required: true
    evidence_tissue_scope_must_match: true
    evidence_area_basis_must_match: true
    provenance_required: true
    numerical_conversion_implemented: false
    inferred_conversion_factor_forbidden: true
  cross_tissue_scope:
    default: FAIL_CLOSED
  cross_area_basis:
    default: FAIL_CLOSED

conversion_evidence_contract:
  paired_measurement_representation: explicit_source_target_pair_records
  minimum_pair_count: 1
  pair_id_unique: true
  source_target_measurement_ids_distinct_within_pair: true
  measurement_record_reuse_across_pairs_forbidden: true
  tissue_scope_bound: true
  area_basis_bound: true
  source_target_direction_must_match: true
  declared_contract_evidence_id_must_match: true
  numerical_conversion_factor_present: false
  parameter_activation: false
  calibration: false

serialization_contract:
  schema: schemas/v3_1/mass_basis_contract.schema.json
  python_schema_text_parity:
    whitespace_only_text_rejected: true
    applies_to:
      - subject_id
      - tissue_scope.identifier_when_string
      - area_basis.identifier_when_string
      - provenance.source_id
      - provenance.source_locator
      - provenance.revision
      - provenance.note_when_string
      - conversion_evidence_id_when_string


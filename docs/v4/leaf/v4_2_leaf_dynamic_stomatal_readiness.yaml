  - define_evidence_acquisition_packet_and_required_variable_metadata
  - register_candidate_response_domains_only_when_supported_by_matched_data
  - pre_register_validation_metrics_and_holdout_structure
  - perform_independent_item_review_after_evidence_packet_is_complete


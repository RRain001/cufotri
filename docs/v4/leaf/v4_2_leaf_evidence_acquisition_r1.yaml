schema_version: v1
stage: V4-2
round: R1
registry_id: V4_2_LEAF_EVIDENCE_ACQUISITION_R1
repository: RRain001/CTEAS_ufotri
base_main_sha: 702ce51fccc167127b7a318f3d8652c064e73aef
branch: codex/v4-2-leaf-evidence-acquisition-r1
status: HOLD_FILE_LEVEL_EVIDENCE_AUDIT_REQUIRED

objective: >-
  Identify public empirical datasets that can satisfy the V4-2 matched leaf
  evidence packet for dynamic stomatal-response review. This round performs
  source triage only. It does not admit a dataset, calibrate a model, select
  coefficients, or authorize solver implementation.

full_packet_minimum_requirements:
  - observed_stomatal_conductance_or_leaf_surface_resistance
  - light_or_PAR
  - VPD_or_explicit_humidity_to_VPD_basis
  - leaf_temperature
  - dataset_bound_growth_stage_ontology
  - crop_identity
  - timestamp_and_interval_semantics
  - replicate_or_independent_group_identity
  - quantitative_units
  - variable_level_provenance
  - matched_records_or_explicit_alignment_contract

admission_rule: >-
  Search-result metadata, article methods, or semantic compatibility alone are
  insufficient for admission. A candidate becomes a full empirical packet only
  after file-level audit proves all required variables, row/group alignment,
  units, provenance, ontology identity, and split eligibility.

candidates:
  - candidate_id: MONNENS_2023_SOYBEAN_VPD_DRYAD
    priority: 1
    species: Glycine max
    source_dataset_doi: 10.5061/dryad.h18931zrh
    source_dataset_url: https://datadryad.org/dataset/doi:10.5061/dryad.h18931zrh
    related_article_doi: 10.1111/nph.18929
    public_file: Monnens_et_al_All_data_Dryad.xlsx
    proven_from_public_metadata_or_article:
      - soybean_two_elite_genotypes
      - LI_6800_leaf_gas_exchange
      - stomatal_conductance_gsw_measured
      - VPD_manipulated_under_controlled_conditions
      - temperature_held_constant_in_controlled_VPD_runs
      - PAR_held_constant_in_controlled_VPD_runs
      - field_gas_exchange_used_temperature_RH_and_light_tracking
      - public_Dryad_dataset_exists
    unresolved_for_packet_admission:
      - per_observation_leaf_temperature_column_not_yet_file_verified
      - per_observation_PAR_or_light_column_not_yet_file_verified
      - timestamp_or_interval_semantics_not_yet_file_verified
      - replicate_or_independent_group_field_not_yet_file_verified
      - dataset_specific_growth_stage_field_and_ontology_not_yet_verified
      - two_point_or_limited_VPD_design_may_not_support_full_response_domain
    disposition: PRIORITY_FILE_LEVEL_AUDIT_REQUIRED
    full_packet_admitted: false
    implementation_authorization_contribution: NONE_UNTIL_FILE_AUDIT


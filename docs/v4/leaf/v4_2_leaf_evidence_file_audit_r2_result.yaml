source_file_inventory:
  MONNENS_2023_SOYBEAN_VPD_DRYAD:
    Monnens_et_al_All_data_Dryad.xlsx:
      sheets:
        - name: Figure 1
          dimension: A2:G24
          content: hydrogen production with/without nodules, per plant rows
        - name: Figure 2
          dimension: A1:D293
          content: hydrogen production per plant/root/nodule mass normalizations
        - name: Figure 3
          dimension: A2:E37
          content: hydrogen production Morning/Afternoon x Sand/Soil
        - name: Figure 4
          dimension: A2:O87
          content: transpiration rate (mol m-2 s-1) Morning/Afternoon x Sand/Soil
        - name: Figure 5
          dimension: A1:D56
          content: >-
            hydrogen production at four declared VPD/temperature conditions:
            0.5 kPa 25C, 2.0 kPa 25C, 0.8 kPa 30C, 3.0 kPa 30C
        - name: Figure 6
          dimension: A2:D54
          content: >-
            per-plant fold increases Low-to-High VPD for hydrogen production,
            transpiration rate, CO2 assimilation rate, stomatal conductance
      key_observation: >-
        The workbook contains no numeric VPD column, no absolute stomatal
        conductance values, no leaf-temperature column, and no PAR/light
        column in any sheet. VPD and temperature exist only inside Figure 5
        column-header labels; stomatal conductance appears only as Figure 6
        fold-increase ratios.
  TOMEO_ROSENTHAL_2018_SOYBEAN_DRYAD:
    CE_GasExchangeParameters.csv:
      shape: 71 rows x 21 cols
      identity_columns: [cultivar, repl]
      target_column: ss_gs
      driver_columns_present: []
    Field_GasExchangeParameters.csv:
      shape: 89 rows x 29 cols
      identity_columns: [cultivar, locRow, locCol, camp]
      target_column: ss_gs
      stage_column: camp
      driver_columns_present: []
    key_observation: >-
      Both tables are steady-state gas-exchange parameter summaries (one row
      per plant or plant-occasion). No VPD, PAR/light, RH/humidity,
      leaf-temperature, or fine-grained timestamp columns exist. press400 is
      ambient atmospheric pressure (kPa), not VPD.

per_candidate_field_matrix:
  MONNENS_2023_SOYBEAN_VPD_DRYAD:
    - field_id: observed_stomatal_conductance_or_leaf_surface_resistance
      classification: MISSING
      source_file: Monnens_et_al_All_data_Dryad.xlsx
      sheet_or_table: Figure 6 column D
      exact_column_or_constant: Fold increase in stomatal  conductance
      unit: dimensionless_ratio
      measurement_basis: fold_increase_endpoint
      row_alignment: none_possible_without_raw_values
      missing_count: 1_of_46_rows_n_a
      provenance: figure_tab_mapping_only
      notes: >-
        Absolute observed gsw values are absent from the entire workbook; only
        Low-to-High VPD fold-increase ratios per plant exist.
    - field_id: target_measurement_basis
      classification: AMBIGUOUS
      exact_column_or_constant: Fold increase in stomatal  conductance
      notes: >-
        Header names the quantity but does not define baseline condition,
        denominator pairing, or whether conductance is to water vapor.
    - field_id: light_or_PAR
      classification: MISSING
      notes: >-
        No PAR/light column or constant in any sheet or in the Dryad README.
        Article-level PAR claims were not independently audited and cannot be
        admitted for these rows under the admission rules.
    - field_id: VPD_or_explicit_humidity_to_VPD_basis
      classification: AMBIGUOUS
      exact_column_or_constant: Figure 5 headers (0.5/2.0 kPa at 25C; 0.8/3.0 kPa at 30C)
      notes: >-
        VPD levels are declared only as column-header treatment labels. There
        is no numeric VPD column, the Figure 6 conductance fold is not bound to
        a specific low/high pair, and temperature co-varies across the two
        pairs (25C vs 30C).
    - field_id: leaf_temperature
      classification: AMBIGUOUS
      exact_column_or_constant: Figure 5 headers (25C / 30C)
      notes: Air-versus-leaf basis unstated; no temperature attaches to Figure 6 ratio rows.
    - field_id: dataset_bound_growth_stage_ontology
      classification: MISSING
      notes: No growth-stage information anywhere in workbook or README.
    - field_id: crop_identity
      classification: DIRECT_COLUMN
      exact_column_or_constant: Genotype MN1312CN / Genotype CZ1418LL block labels
      unit: genotype_label
      notes: Species Glycine max established by dataset metadata and article DOI.
    - field_id: timestamp_and_interval_semantics
      classification: AMBIGUOUS
      exact_column_or_constant: Morning / Afternoon header fragments (Figures 3-4 only)
      notes: No dates, clock times, or interval semantics; nothing attaches to Figure 6.
    - field_id: replicate_or_independent_group_identity
      classification: AMBIGUOUS
      notes: One implicit row per plant under genotype blocks (23+23) but no plant ID column.
    - field_id: quantitative_units
      classification: DIRECT_COLUMN
      exact_column_or_constant: mL plant-1 hr-1; mol m-2 s-1; dimensionless fold
      notes: Units present in headers for the quantities actually tabulated.
    - field_id: variable_level_provenance
      classification: AMBIGUOUS
      notes: Figure-tab provenance exists; per-variable measurement-basis provenance for the conductance ratios does not.
    - field_id: matched_records_or_explicit_alignment_contract
      classification: MISSING
      notes: Raw low-/high-VPD conductance values are absent, so ratios cannot be aligned to drivers.
  TOMEO_ROSENTHAL_2018_SOYBEAN_DRYAD:
    - field_id: observed_stomatal_conductance_or_leaf_surface_resistance
      classification: DIRECT_COLUMN
      source_file: CE_GasExchangeParameters.csv + Field_GasExchangeParameters.csv
      sheet_or_table: ss_gs
      exact_column_or_constant: ss_gs
      unit: undeclared_in_README
      measurement_basis: steady_state_conductance_to_water_vapor
      row_alignment: per_plant_CE / per_plant_occasion_Field
      missing_count: 0_of_71_CE / 0_of_89_Field
      provenance: README_for_CE + README_for_Field
      notes: >-
        Real measured per-plant conductance endpoints exist in both tables
        (CE range 0.1546-0.4213; Field range 0.0988-0.5848).
    - field_id: target_measurement_basis
      classification: DIRECT_COLUMN
      exact_column_or_constant: ss_gs (H2O basis); gsco2 = ss_gs/1.6 (CO2 basis)
      provenance: README definitions
    - field_id: light_or_PAR
      classification: MISSING
      notes: No PAR/light column in either table; no applicable declared constant in READMEs.
    - field_id: VPD_or_explicit_humidity_to_VPD_basis
      classification: MISSING
      notes: >-
        No VPD, RH, humidity, or air/moisture column exists. press400 is
        atmospheric pressure (95.9-101.0 kPa), not a humidity measure. No
        explicit humidity-to-VPD derivation inputs are provided.
    - field_id: leaf_temperature
      classification: MISSING
      notes: No leaf-temperature or chamber-temperature column in either table.
    - field_id: dataset_bound_growth_stage_ontology
      classification: EXPLICIT_DERIVATION_SUPPORTED
      source_file: Field_GasExchangeParameters.csv
      sheet_or_table: camp
      exact_column_or_constant: camp in {july, aug, sept}
      provenance: >-
        README_for_Field states camp identifies measurement month AND maps
        july==lateVegetative (article V4/V5), aug==earlyReproductive
        (article R2-R4), sept==lateReproductive (article R6).
      row_alignment: direct_row_attribute
      notes: >-
        This is a dataset-internal row-level mapping, stronger than
        article-context-only evidence. CE table has no stage field (MISSING there).
    - field_id: crop_identity
      classification: DIRECT_COLUMN
      exact_column_or_constant: cultivar (12 CE codes; 8 Field codes)
      notes: Glycine max established by README and article.
    - field_id: timestamp_and_interval_semantics
      classification: AMBIGUOUS
      exact_column_or_constant: camp month labels (Field); none (CE)
      notes: Month granularity only; no date/time or interval semantics.
    - field_id: replicate_or_independent_group_identity
      classification: DIRECT_COLUMN
      exact_column_or_constant: CE cultivar+repl (71 unique); Field cultivar+locRow+locCol (31 plots)
      missing_count: 0 duplicate identities in CE
    - field_id: quantitative_units
      classification: AMBIGUOUS
      notes: >-
        READMEs define column semantics but declare almost no units (only
        press400 kPa). Units would require article-text verification, which is
        outside the audited file set.
    - field_id: variable_level_provenance
      classification: DIRECT_COLUMN
      provenance: READMEs define every column including which values are estimated (gm).
    - field_id: matched_records_or_explicit_alignment_contract
      classification: MISSING
      notes: >-
        Tables are ENDPOINT_OR_FITTED_PARAMETER_SUMMARY (one steady-state row
        per plant/occasion). Driver variables are unrecorded, so matched
        driver-response records cannot exist in these files.


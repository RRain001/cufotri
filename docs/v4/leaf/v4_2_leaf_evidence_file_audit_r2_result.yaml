nonblocking_notes:
  - >-
    Tomeo Field camp->stage mapping is genuine reusable component evidence for
    any future dataset that adds driver columns.
  - >-
    All four Tomeo published MD5 values match local bytes exactly; the Zenodo
    mirror preserves the Dryad publication revision (no SOURCE_VERSION_MISMATCH).
  - >-
    Monnens header-declared VPD contrast design remains valuable if raw
    LI-6800 logs can be obtained from authors in a later round.
  - >-
    Dryad now gates API/file downloads behind bearer-token auth plus an Anubis
    proof-of-work browser check; retrieval paths are recorded in
    source_file_hashes for reproducibility.


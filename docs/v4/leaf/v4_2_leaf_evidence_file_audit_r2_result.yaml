response_domain_assessment:
  MONNENS_2023_SOYBEAN_VPD_DRYAD: TWO_CONDITION_CONTRAST
  monnens_detail: >-
    Declared header pairs are 0.5-to-2.0 kPa at 25C and 0.8-to-3.0 kPa at 30C;
    temperature is confounded across pairs and the conductance endpoint is a
    fold increase, so even the contrast is not a clean VPD-only manipulation
    for conductance rows.
  TOMEO_ROSENTHAL_2018_SOYBEAN_DRYAD: INSUFFICIENT_SUPPORT
  tomeo_detail: >-
    Single steady-state endpoint per plant/occasion with zero driver columns;
    no VPD/PAR/Tleaf domain can be characterized from the files at all.

stage_ontology_assessment:
  MONNENS_2023_SOYBEAN_VPD_DRYAD: MISSING
  TOMEO_ROSENTHAL_2018_SOYBEAN_DRYAD_FIELD: SUPPORTED_CAMP_MAPPING
  TOMEO_ROSENTHAL_2018_SOYBEAN_DRYAD_CE: MISSING
  detail: >-
    Field camp->stage mapping is dataset-bound and row-level (README-documented),
    satisfying the stage requirement for Field rows only.

cross_dataset_stitching_check:
  performed: true
  result: NOT_ATTEMPTED_AND_FORBIDDEN
  note: >-
    The two datasets have no natural row alignment; each was judged strictly on
    its own files per the cross_dataset_rule.

schema_packet_feasibility:
  MONNENS_2023_SOYBEAN_VPD_DRYAD: INFEASIBLE
  TOMEO_ROSENTHAL_2018_SOYBEAN_DRYAD: INFEASIBLE
  detail: >-
    Neither candidate can populate response_domain_records with matched driver
    values, instantiate time_contract beyond month labels, or (for Monnens and
    Tomeo CE) bind a dataset-specific stage ontology. Packet construction would
    require fabricating or importing driver data, which the fail-closed rules
    forbid.


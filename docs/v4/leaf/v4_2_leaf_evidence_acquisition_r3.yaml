schema_version: v1
stage: V4-2
round: R3
registry_id: V4_2_LEAF_EVIDENCE_ACQUISITION_R3
repository: RRain001/CTEAS_ufotri
base_main_sha: 079238804bd0a43892806780ac5d68f5feccee7f
branch: codex/v4-2-leaf-evidence-acquisition-r3
status: IN_PROGRESS_BROADENED_EMPIRICAL_SEARCH

objective: >-
  Broaden empirical evidence acquisition after R2 established that the two
  highest-priority public soybean datasets do not contain a complete matched
  dynamic stomatal-response packet. Prefer a single soybean experiment with
  row-aligned gsw (or rc), VPD, PAR/light, Tleaf, stage/group identity, units,
  provenance, and independent-group semantics. Do not use cross-dataset
  stitching to manufacture completeness.

hard_invariants:
  leaf_implementation_authorized: false
  solver_implementation_started: false
  candidate_parameter_values_admitted: false
  calibration_started: false
  active_parameters: 0
  ufotri_active_database: false
  v3_physics_ready: false
  physical_validation_complete: false

search_order:
  - public_single_experiment_soybean_raw_records
  - public_single_experiment_soybean_processed_but_row_aligned_records
  - author_available_soybean_raw_LI_COR_logs
  - non_soybean_complete_packets_for_methodology_only
  - evidence_composition_design_only_after_explicit_separate_review

admission_minimum:
  - absolute_observed_gsw_or_rc
  - VPD_or_full_humidity_derivation_inputs
  - PAR_or_light
  - Tleaf
  - dataset_bound_stage_or_explicit_developmental_context
  - crop_identity
  - timestamp_or_interval_semantics
  - independent_group_identity
  - units
  - variable_level_provenance
  - matched_row_or_explicit_alignment_contract


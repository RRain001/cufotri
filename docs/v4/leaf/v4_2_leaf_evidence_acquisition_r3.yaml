next_gate: >-
  Perform file-level triage on public R3 candidates and determine whether any
  single soybean source can satisfy the V4-2 empirical packet. If no such source
  exists, prepare an explicit decision between author-data acquisition,
  prospective experiment design, or a separately reviewed evidence-composition
  model. Do not lower the packet requirements silently.

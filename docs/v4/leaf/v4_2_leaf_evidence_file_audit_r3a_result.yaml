cross_dataset_rule:
  applied: true
  stitching_attempts: 0
  note: >-
    Mostofa gsw + Tejera drivers, Helicoverpa gs + Mostofa conditions, and all
    analogous combinations were not attempted. Each candidate judged strictly
    alone.

declared_constant_applicability:
  mostofa_article_conditions: NOT_ADMISSIBLE_THIS_ROUND
  detail: >-
    PAR 1000 μmol m-2 s-1, chamber 30 degC, CO2 420 μmol mol-1 and water vapor
    22-26 mmol mol-1 are article-level claims that appear nowhere in the audited
    files; no audited file establishes their applicability to the Fig 3d rows,
    so DECLARED_CONSTANT_WITH_PROVENANCE cannot be granted under the
    constant-admission rule.
  tejera_par_effectively_constant_observed: true
  detail_tejera: >-
    Unlike Mostofa, Tejera PAR constancy is observed per-row inside the file
    (1499.7-1500.3), which is direct evidence rather than external declaration.

vpd_derivation_assessment:
  mostofa: IMPOSSIBLE_MISSING_PER_ROW_INPUTS
  tejera: NOT_REQUIRED_DIRECT_COLUMN_PRESENT
  helicoverpa: IMPOSSIBLE_NO_HUMIDITY_TEMPERATURE_INPUTS


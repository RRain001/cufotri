candidate_results:
  - candidate_id: MOSTOFA_2025_CRYPTIC_ISOPRENE_SOYBEAN_DRYAD
    instrument_semantics: LI-6800-style gas exchange per article; workbook itself does not state instrument
    experiment_identity: single wound-response trace on soybean leaves (article Williams 82, stage R1 not file-bound)
    packet_result: HOLD_REQUIRED_FIELDS_MISSING
    full_packet_candidate: false
    field_matrix:
      - field_id: observed_stomatal_conductance_or_leaf_surface_resistance
        classification: DIRECT_COLUMN
        source_file: Raw_data_Mostofa_et_al._2025.xlsx
        sheet_or_table: Fig 3d
        exact_column_or_constant: 'gsw (mol m-2 s-1)'
        unit: mol m-2 s-1
        measurement_basis: absolute_stomatal_conductance_to_water_vapor
        row_alignment: single_time_series_rows_3_to_152
        missing_count: 0_of_150
        provenance: sheet title + header + Dryad README Figure 3d description
        notes: Absolute values, not ratios or figure summaries.
      - field_id: target_measurement_basis
        classification: DIRECT_COLUMN
        exact_column_or_constant: gsw header + mol m-2 s-1 unit
        notes: LI-COR gsw convention (water-vapor basis); basis consistent with article instrument claim but instrument is not stated inside the file.
      - field_id: light_or_PAR
        classification: MISSING
        notes: No PAR column or constant in any sheet or the dataset README; article-level 1000 μmol m-2 s-1 was not audited from article text and is not bound to these rows by any audited file.
      - field_id: VPD_or_explicit_humidity_to_VPD_basis
        classification: MISSING
        notes: >-
          No VPD/humidity column. The declared water-vapor range 22-26 mmol/mol
          is a protocol span, not a per-record value; without per-row H2O mole
          fraction, Tleaf and pressure, exact row-level VPD derivation is
          impossible. Range midpoint substitution is forbidden.
      - field_id: leaf_temperature
        classification: MISSING
        notes: >-
          No Tleaf column. The 30 degC chamber/block temperature is neither
          recorded per row nor explicitly declared as actual leaf temperature
          for these records, so DECLARED_CONSTANT_WITH_PROVENANCE is not admissible.
      - field_id: dataset_bound_growth_stage_or_explicit_developmental_context
        classification: AMBIGUOUS
        notes: >-
          R1 stage and Williams 82 cultivar come from article/Dryad-page context;
          no audited file binds stage to the Fig 3d records.
      - field_id: crop_identity
        classification: DIRECT_COLUMN
        exact_column_or_constant: sheet title 'soybean leaves' + dataset README
        unit: species_name
      - field_id: timestamp_and_interval_semantics
        classification: DIRECT_COLUMN
        exact_column_or_constant: "' Time(min)' column"
        unit: minutes
        row_alignment: uniform 0.083333 min steps = exactly 5 s across all 150 rows
        notes: >-
          Interval semantics proven from data itself; elapsed-time semantics only
          (no wall-clock timestamps).
      - field_id: replicate_or_independent_group_identity
        classification: MISSING
        notes: Single trace with no plant/leaf/rePLICATE identifier; n=1 series cannot define independent groups.
      - field_id: quantitative_units
        classification: DIRECT_COLUMN
        exact_column_or_constant: header units for A and gsw
      - field_id: variable_level_provenance
        classification: AMBIGUOUS
        notes: Figure-tab mapping exists, but measurement conditions (instrument settings) for this trace are documented nowhere in the audited files.
      - field_id: matched_records_or_explicit_alignment_contract
        classification: MISSING
        notes: A and gsw are row-aligned within the trace, but driver variables (VPD/PAR/Tleaf) have no records to align.
    response_domain: WOUND_RESPONSE_TIME_SERIES_NOT_DRIVER_RESPONSE
    response_domain_detail: >-
      The dynamic axis is wounding time at fixed (but unrecorded) chamber
      conditions; there is no VPD/light/temperature response domain.
    stage_result: AMBIGUOUS_ARTICLE_CONTEXT_ONLY
    group_result: SINGLE_SERIES_NO_GROUPS
    row_alignment_result: INTERNAL_ONLY_NO_DRIVER_ALIGNMENT
    blocking_findings:
      - BLOCKER_NO_PER_ROW_OR_DECLARED_APPLICABLE_VPD_HUMIDITY
      - BLOCKER_NO_TLEAF_COLUMN_OR_BOUND_CONSTANT
      - BLOCKER_NO_PAR_COLUMN_OR_BOUND_CONSTANT
      - BLOCKER_SINGLE_TRACE_NO_INDEPENDENT_GROUP_IDENTITY
      - BLOCKER_STAGE_NOT_FILE_BOUND
    nonblocking_findings:
      - COMPONENT_ABSOLUTE_GSW_AT_EXACT_5S_CADENCE_EXISTS

  - candidate_id: TEJERA_NIEVES_WALKER_2024_ACI_SOYBEAN_DRYAD
    instrument_semantics: LI-6800 (README/article); thermocouple Tleaf; units declared per column
    experiment_identity: multi-species A/Ci protocol comparison; RunID = species+treatment+replicate
    packet_result: HOLD_COMPONENT_EVIDENCE_ONLY

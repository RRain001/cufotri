cross_dataset_rule: >-
  Never combine target variables from one dataset with forcing, stage, or group
  variables from another dataset merely to satisfy packet completeness. Any
  evidence-composition model is a changed inference model and requires a separate
  explicit design and independent review.

constant_admission_rule: >-
  A chamber setpoint or protocol constant may be classified as
  DECLARED_CONSTANT_WITH_PROVENANCE only when source evidence establishes that
  it applies to the same audited records. A range such as 22-26 mmol mol-1 water
  vapor is not a per-record humidity value and cannot by itself support exact
  VPD derivation.

derivation_rule: >-
  VPD derivation is allowed only when all necessary variables, units, equations,
  pressure basis and row alignment are explicit. Approximation from incomplete
  chamber conditions is not admitted.

response_domain_rule: >-
  Characterize empirical support only from observed or explicitly source-bound
  records. Do not fit stomatal-response coefficients. Fixed chamber conditions
  can document scope but do not establish a response function along that axis.

raw_data_policy:
  commit_third_party_raw_files: false
  external_workspace_required: true
  record_hashes: true
  record_resolved_urls: true
  record_byte_sizes: true

result_artifacts_required:
  - docs/v4/leaf/v4_2_leaf_evidence_file_audit_r3a_result.yaml
  - docs/v4/reports/v4_2_leaf_evidence_file_audit_r3a_result.md
  - tests/v4/test_v4_2_leaf_evidence_file_audit_r3a.py

exit_policy: >-
  Even PASS_ONE_COMPLETE_EMPIRICAL_PACKET_CANDIDATE does not authorize leaf
  solver implementation. A concrete packet must then be constructed and pass an
  independent leaf item review before implementation authorization can be
  reconsidered.

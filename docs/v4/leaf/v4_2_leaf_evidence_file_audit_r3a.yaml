schema_version: v1
stage: V4-2
round: R3A
registry_id: V4_2_LEAF_EVIDENCE_FILE_AUDIT_R3A
repository: RRain001/CTEAS_ufotri
base_main_sha: 3e7ec58b19752da9eef018a80875d0a90bd6164f
branch: codex/v4-2-leaf-evidence-file-audit-r3a
status: PENDING_LOCAL_FILE_LEVEL_AUDIT

objective: >-
  Perform byte-level audit of the highest-value R3 public soybean candidates.
  Determine whether any single source provides a complete matched empirical
  packet for the V4-2 leaf dynamic stomatal-response review. Do not fit a model,
  select coefficients, activate parameters, or implement a solver.

classification_enum:
  - DIRECT_COLUMN
  - DECLARED_CONSTANT_WITH_PROVENANCE
  - EXPLICIT_DERIVATION_SUPPORTED
  - MISSING
  - AMBIGUOUS

allowed_final_verdicts:
  - PASS_ONE_COMPLETE_EMPIRICAL_PACKET_CANDIDATE
  - HOLD_COMPONENT_EVIDENCE_ONLY
  - HOLD_REQUIRED_FIELDS_MISSING
  - HOLD_ALIGNMENT_OR_PROVENANCE_AMBIGUOUS

hard_invariants:
  leaf_implementation_authorized: false
  solver_implementation_started: false
  candidate_parameter_values_admitted: false
  calibration_started: false
  active_parameters: 0
  ufotri_active_database: false
  v3_physics_ready: false
  physical_validation_complete: false

required_packet_fields:
  - observed_stomatal_conductance_or_leaf_surface_resistance
  - target_measurement_basis
  - light_or_PAR
  - VPD_or_explicit_humidity_to_VPD_basis
  - leaf_temperature
  - dataset_bound_growth_stage_or_explicit_developmental_context
  - crop_identity
  - timestamp_and_interval_semantics
  - replicate_or_independent_group_identity
  - quantitative_units
  - variable_level_provenance
  - matched_records_or_explicit_alignment_contract


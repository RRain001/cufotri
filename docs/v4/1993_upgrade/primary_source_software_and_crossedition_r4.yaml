notes:
  - "Table 1 prints masses as g in its cells; §7.4.3 BEWG/BEWGZ/BEWGP etc. input cards explicitly use g/m². Separate printed table unit from runtime area-normalized parameter unit."
  - "Table 2/3 IMSL library names are historical evidence; original package requires IMSL variants or NAG library, not proof of bitwise identical alternative implementation."
  - "Table 5 test job cards are examples, and differ from the guide's written default values. Physical defaults must be sourced from the guide's named input entries."
  - "Table 6-8 are software and computational topology, not new physical parameter tables."
  - "1991 v4-style model options already include extended stomatal IMODEL=1; do not attribute every present-in-1993 feature to a 1993 invention."
  - "Scope not exhaustive: full NAMELIST §7.2–7.4.10 cards, numerical methods and independent science audit remain open."

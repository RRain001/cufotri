unresolved:
  - key: "HISTORICAL_INPUT_UNITS"
    why: "Wind speed and rain rate use integer 1/100 units; importing modern m/s, mm/h directly changes physics."
    status: "REQUIRES_P1_EXPLICIT_UNIT_ADAPTER"
  - key: "WASHOUT_DEFAULT_BRANCH"
    why: "IWASH default 0 with class-specific coefficients; documented power law is an alternative, not automatically the default."
    status: "SOURCE_CONFIRMED_NOT_IMPLEMENTED"
  - key: "RELFA_PERCENT_OR_FRACTION"
    why: "Fixed humidity source label percent, default 0.5; unit convention not resolved."
    status: "SOURCE_LIMITED"
  - key: "FIXED_RUN_USAGE"
    why: "Report recommends fixed stationary mode only for testing and indicates hard-coded rates for IRFIX 1."
    status: "NO_GENERAL_DEPLOYMENT_CLAIM"
  - key: "1990_1991_EXACT_INPUT_EQUIVALENCE"

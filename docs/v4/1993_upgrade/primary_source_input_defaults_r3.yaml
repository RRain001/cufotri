array_defaults:
  - name: "FOODST"
    count: 5
    raw_default: "meat,milk,vegetables,potatoes,wheat"
    printed_page: 63
    pdf_zero_based_page: 72
    as_printed_semantics: "food names, each character*10"
  - name: "COGRF"
    count: 5
    raw_default: "5 * 1250"
    numerical_repeated_value: 1250
    numerical_unit: "Bq/kg fresh mass"
    printed_page: 63
    pdf_zero_based_page: 72
    as_printed_semantics: "historical model food restriction intervention threshold, not a present-day regulatory limit"
  - name: "TIMEDO"
    count: 12
    raw_default: "1,3,7,14,21,30,90,180,200,360,2*3600"
    raw_default_count_interpretation: "2*3600 is Fortran-like repeat notation for two 3600 entries; interpretation requires original-loader review"
    printed_page: 63
    pdf_zero_based_page: 72
    as_printed_semantics: "dose/food intervention evaluation times in days"
    source_caveat: "Text says first two values 1 and 3 are internally replaced by 24 and 72 hours; do not reinterpret values before verifying exact software behavior."
model_semantics:
  - name: "IARTBO"
    dependency: "IBODEX=1"
    cases:
      "1": "humus sandy loam, special parameters"
      "2": "loamy sand, special parameters"
      "3": "sand, special parameters"
      "4": "custom user-defined 7 parameter hydraulic closure"
    warning: "Soil AP/BP/CP/... numerical defaults on printed page 61 are not necessarily active for all IARTBO soil types. Must not conflate preset soil-type branch and custom parameters."
  - name: "IBODFX"
    dependency: "external meteorological soil moisture file"
    warning: "IBODFX=1 relies on hourly soil water input, not just scalar BODEIN."
  - name: "FOOD_RESTRICTION"
    dependency: "TIMEDO, COGRF, IBANWR"
    warning: "Manual says effective dose equivalent stored for further evaluation is NOT modified by food restriction; alternative restricted doses are stored separately on logical unit 95 only if IBANWR=1."
source_conflicts:
  - kind: "UNIT_BASIS_REVIEW"
    scope: "NASS, WATM"
    description: "Historical printed mass and area/time units are retained verbatim; not projected into modern forcing units."
  - kind: "ARRAY_DEFAULT_AND_RUNTIME_BRANCH_REVIEW"
    scope: "TIMEDO"
    description: "Print uses 2*3600 repetition and text states internal overwrites for first two times; original FORTRAN execution not recovered."
not_covered:

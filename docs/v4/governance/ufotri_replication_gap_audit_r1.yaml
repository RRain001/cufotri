candidate_extension_decisions:
  leaf_r5:
    candidate_name: LEAF_R5_DYNAMIC_STOMATAL_IMPLEMENTATION
    decision: CURRENT_R5_AS_DESIGNED_NOT_REQUIRED_FOR_REPLICATION
    replication_need: UFOTRI_LEAF_EQ7_31_FIDELITY_RECONCILIATION_REQUIRED
    rationale: >-
      UFOTRI requires its manual aerodynamic/boundary/stomatal/LAI/day-night/
      meteorological exchange relations. The repository already contains a
      historical manual-informed V2 implementation. The current R5 candidate
      introduces an empirical g_s_max*F_light*F_vpd*F_temp*F_stage structure
      that is not itself established as the UFOTRI manual equation set. First
      reconcile and port the recoverable manual path; only residual evidence-
      driven improvements remain optional.
    next_stage: UFOTRI_LEAF_EQ7_31_RECONCILIATION_R1

  richards_darcy:
    candidate_name: FULL_RICHARDS_DARCY_HYDROLOGY
    decision: REPLICATION_REQUIRED_MANUAL_EQ33_37
    replication_need: UFOTRI_EQ33_37_SOIL_HYDROLOGY_REQUIRED
    rationale: >-
      UFOTRI explicitly includes soil water potential and Darcy/Richards
      transport. Current V4 accepts signed transport fluxes from the caller and
      therefore omits the manual hydrologic closure. The required work should
      reproduce the UFOTRI Eq.33-37 mechanism and discretization semantics, not
      build an unconstrained general-purpose hydrology model.
    priority_after_leaf_reconciliation: true

  multi_pool_obt:
    candidate_name: MULTI_POOL_OBT
    decision: REPLICATION_REQUIRED_IN_NARROW_UFOTRI_FORM_ONLY
    replication_need: UFOTRI_EXCHANGEABLE_NONEXCHANGEABLE_OBT_COMPARTMENTS_REQUIRED
    rationale: >-
      A one-pool k_f/k_r OBT state is not sufficient for the manual's explicit
      exchangeable/non-exchangeable distinction. However, a generic or
      precursor-rich multi-pool architecture is not automatically UFOTRI-
      equivalent. First reconstruct the manual E/N compartment semantics and
      only add extra pools if separately justified.
    next_decision_stage: UFOTRI_OBT_E_N_COMPARTMENT_RECONSTRUCTION_R1

post_audit_ranking:

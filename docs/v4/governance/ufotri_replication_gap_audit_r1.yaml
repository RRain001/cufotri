purpose: >-
  Audit the frozen post-RC1 repository against the available UFOTRI KfK 4605
  manual and decide which post-RC1 physics extensions are actually required for
  a manual-based UFOTRI functional reconstruction. This stage does not modify
  solver physics or the RC1 baseline.

authority_and_limits:
  ufotri_manual_available: true
  ufotri_original_source_code_available: false
  ufotri_original_executable_available: false
  original_parameter_loader_available: false
  exact_original_numerical_regression_possible: false
  manual_based_functional_reconstruction_auditable: true
  full_ufotri_manual_based_replication_complete: false
  original_ufotri_numerical_equivalence_established: false
  terminology_rule: >-
    Even after all recoverable manual mechanisms are implemented, the strongest
    defensible claim without original source/executable regression is
    UFOTRI_MANUAL_BASED_FUNCTIONAL_RECONSTRUCTION, not exact original executable
    reproduction.

classification_ontology:
  - MANUAL_ROLE_COVERED
  - FUNCTIONAL_RECONSTRUCTION
  - PARTIAL_RECONSTRUCTION
  - HISTORICAL_IMPLEMENTATION_NOT_IN_RC1
  - NOT_IMPLEMENTED
  - PROJECT_REPLACEMENT_NOT_EQUIVALENT
  - NOT_IMPLEMENTED_AS_VALIDATION
  - UNVERIFIABLE_SOURCE_UNAVAILABLE


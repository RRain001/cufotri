  kfk_atmospheric_ht_oxidation_0_5_percent_per_day: outside_e2
  kfk_ht_soil_diffusion_5e_2_cm2_s: evidence_only_not_conversion_rate
  production_parameter_activation: false

forbidden_scope:
  independent_soil_ht_pool: true
  invented_microorganism_half_life: true
  tunable_manual_conversion_fraction: true
  atmospheric_ht_oxidation: true
  ht_derived_hto_reemission: true
  real_cteas_atmos_ht_binding: true
  production_parameter_activation: true
  calibration: true
  empirical_validation_claim: true
  physical_accuracy_claim: true
  production_readiness_claim: true
  original_executable_equivalence_claim: true

qualification:

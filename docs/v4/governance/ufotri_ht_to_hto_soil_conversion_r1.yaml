  pytest: tests/v4/test_ufotri_ht_to_hto_soil_conversion_r1.py
  required_gates:
    - direct_eq1_eq2_conversion_identity
    - ht_loss_equals_hto_gain
    - zero_residual_soil_ht
    - conversion_ledger_closure
    - interval_partition_additivity
    - primary_hto_preserved
    - ht_derived_hto_explicit
    - combined_soil_input_closure
    - existing_l1_inventory_integration
    - no_direct_l2_l3_injection
    - benchmark_non_activation
    - e3_reemission_absent
    - atmospheric_oxidation_absent
    - fail_closed_time_and_type_contracts


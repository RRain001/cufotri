    microorganism_conversion_is_described_as_very_rapid: true
    only_transformed_ht_remains_in_soil: true
    independent_soil_ht_kinetic_pool_recovered: false
    microbial_conversion_half_time_recovered: false

implementation_decision:
  source_module: src/cteas_ufotri/coupling/ht_to_hto_soil_v4.py
  opt_in: true
  existing_source_modified: false
  conversion_semantics: KFK4605_EQ1_EQ2_DIRECT_SOIL_CONVERSION_R1
  input_boundary: HTSoilDepositionBoundary
  output_receiver: ThreeLayerSoilForcing.surface_deposition_flux_bq_m2_s

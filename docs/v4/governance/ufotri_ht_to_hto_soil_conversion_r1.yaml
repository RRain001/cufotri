manual_authority:
  source: KfK_4605
  anchors:
    - secondary_model_soil_balance_eq_1
    - secondary_model_soil_balance_eq_2
    - section_2_2_3_soil_atmosphere_exchange
  recovered_semantics:
    soil_state_is_hto: true
    atmospheric_ht_term_enters_soil_hto_as_vd_ht_times_x_ht: true
    direct_soil_ht_to_hto_conversion_indicated_only_by_deposition_rate: true

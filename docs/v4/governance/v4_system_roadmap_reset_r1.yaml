schema_version: v1
stage: V4_SYSTEM_ROADMAP_RESET_R1
status: PASS_CONTROL_PLANE
repository: RRain001/CTEAS_ufotri
base_main_sha: d4bb2def0e81fe5a26b772a239e8c6de8f0d0dcc
branch: codex/v4-system-roadmap-reset-r1

north_star:
  pathway:
    - CTEAS-Atmos forcing
    - atmospheric HTO concentration and deposition
    - soil and plant HTO state
    - TFWT and OBT
    - food transfer
    - intake
    - dose
  complexity_rule: >-
    New physical complexity is admitted only when its role in the complete pathway is explicit
    and independent evidence supports the proposed physical change.

baseline:
  default_profile: v3_frozen_baseline
  rollback_target: v3_frozen_baseline
  v3_1_mass_basis_preserved: true
  solver_equations_changed: false
  numerical_coupling_changed: false
  runtime_state_changed: false
  candidate_parameter_values_admitted: false
  active_parameters: 0
  calibration_started: false
  v3_physics_ready: false

leaf_r4_checkpoint:
  current_status: DESIGN_ONLY_NOT_COLLECTED
  checkpoint_frozen: true
  experiment_executed: false
  empirical_packet_collected: false
  response_function_selected: false
  calibration_started: false
  leaf_solver_implementation_authorized: false
  r5_continuation_authorized: false
  resume_conditions:
    - later_system_priority_review
    - complete_admissible_empirical_packet_arrival

next_stages:
  - order: 1
    stage_id: V4_SYSTEM_ATMOS_EXCHANGE_CONTRACT
    scope: CONTROL_PLANE_AND_INTERFACE_CONTRACT_ONLY
    objective: >-
      Freeze the production-facing CTEAS-Atmos to CTEAS-UFOTRI exchange contract without
      waiting for CTEAS-Atmos solver completion, while keeping replay and synthetic forcing usable.
    required_contract_fields:
      - timestamp_and_interval_semantics
      - location_or_grid_identity
      - air_hto_concentration
      - deposition_flux_semantics
      - temperature
      - humidity
      - wind_speed
      - precipitation
      - units
      - missing_data_policy
      - model_and_dataset_provenance
      - quality_status
    forbidden:
      - cteas_atmos_solver_reimplementation
      - real_production_coupling_activation
      - ufotri_solver_physics_change
      - silent_unit_conversion
      - missing_value_repair_without_contract

  - order: 2
    stage_id: V4_SYSTEM_PHYSICS_GAP_SENSITIVITY_AUDIT
    scope: SYSTEM_LEVEL_AUDIT_ONLY
    objective: >-
      Classify unresolved physical inputs across the complete environmental-transfer and dose chain
      and rank them by their material influence on target outputs before further model elaboration.
    required_parameter_classes:
      - physical_constant
      - external_scenario_input
      - directly_evidenced
      - conceptually_mapped_only
      - unresolved_or_no_evidence
      - synthetic_test_only
    required_pathways:
      - atmosphere
      - soil
      - leaf_exchange
      - TFWT
      - OBT
      - root_uptake
      - food_transfer
      - intake
      - dose
    output_requirements:
      - gap_registry
      - sensitivity_priority_matrix
      - evidence_priority_decision
      - explicit_hold_or_advance_decision_per_subsystem
    forbidden:
      - parameter_fitting
      - activation
      - production_claim
      - using_synthetic_regression_as_empirical_validation

soil_architecture:
  current_runtime:
    representation: ONE_LAYER_HTO_INVENTORY
    transport_boundary: SIGNED_FLUX_INPUT
    full_hydrology: false
  three_layer_target:
    status: CANDIDATE_NOT_IMPLEMENTED
    implementation_authorized: false
    minimum_preimplementation_contract:
      - three_layer_water_inventory_ownership
      - three_layer_hto_inventory_ownership
      - interlayer_water_and_hto_flux_semantics
      - surface_input
      - lower_boundary_loss
      - root_zone_extraction
      - radioactive_decay
      - layer_conservation
      - global_conservation
      - restart_contract
      - failure_behavior
  richards_darcy_hydrology:
    status: NOT_AUTHORIZED

system_priority_after_audit:
  ordering_rule: >-
    Future physics work is ordered by system dependency and output sensitivity, not by the amount
    of documentation already accumulated for a subsystem.
  candidate_dependency_notes:
    root_and_soil: >-
      Root water-flux redesign depends on explicit soil-layer water ownership and therefore may
      require soil architecture work before root implementation.
    leaf: >-
      R4 already defines the evidence gap; hold unless system priority or admissible data justifies resumption.
    obt: >-
      Keep the current reduced first-order baseline until matched TFWT/OBT time-resolved evidence is available.
    food_intake_dose: >-
      Keep endpoint assessment semantics unless the system audit identifies these as material limitations.

hard_invariants:
  leaf_r5_authorized: false
  three_layer_soil_implemented: false
  full_soil_hydrology_authorized: false
  solver_changes_authorized: false
  numerical_coupling_changes_authorized: false
  real_cteas_atmos_coupling_active: false
  active_parameters: 0
  calibration_started: false
  v3_physics_ready: false
  physical_validation_complete: false

exit_state:
  roadmap_reset_complete: true
  next_stage: V4_SYSTEM_ATMOS_EXCHANGE_CONTRACT
  following_stage: V4_SYSTEM_PHYSICS_GAP_SENSITIVITY_AUDIT
  leaf_track: HOLD_AT_R4_CHECKPOINT

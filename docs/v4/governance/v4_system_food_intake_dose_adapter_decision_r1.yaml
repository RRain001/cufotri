schema_version: v1
stage: V4_SYSTEM_FOOD_INTAKE_DOSE_ADAPTER_DECISION_R1
status: PASS_SYSTEM_FOOD_INTAKE_DOSE_ADAPTER_DECISION_AWAITING_EXACT_HEAD_GATE
repository: RRain001/CTEAS_ufotri
base_main_sha: 1884bb791873d47d08ceb6300d51b6974dddf37d
branch: codex/v4-system-food-intake-dose-adapter-decision-r1

scope:
  control_plane_and_interface_decision_only: true
  production_src_changes: false
  solver_equations_changed: false
  numerical_coupling_changed: false
  endpoint_adapter_implemented: false
  parameter_activation: false
  calibration: false
  leaf_r5: false
  obt_redesign: false
  full_hydrology: false
  real_cteas_atmos_binding: false

upstream_baseline:
  post_orchestration_review_merge_sha: 1884bb791873d47d08ceb6300d51b6974dddf37d
  replay_orchestration_available: true
  replay_endpoint:
    state_type: V4SoilRootTFWTOBTState
    tfwt_type: TFWTState
    obt_type: OBTState
    area_basis: soil_surface_area
    selected_operator_split: PRESERVE_V3_POST_OBT_ROOT_GAIN
  v3_default_changed: false
  active_parameters: 0

reviewed_existing_apis:
  food_transfer:
    path: src/cteas_ufotri/plant/food_v3/food_transfer_solver.py
    reads_public_obt_tfwt_inventory: true
    requires_shared_obt_tfwt_timestamp: true
    source_unit: Bq_m-2
    harvest_area_is_explicit_m2: true
    output_total_food_inventory_unit: Bq
    returns_remaining_inventory_audit_quantity: true
    mutates_source_plant_state: false
  intake:
    path: src/cteas_ufotri/exposure/intake_v3/intake_solver.py
    equation: FOOD_BQ_DIV_PRODUCT_MASS_KG_TIMES_ANNUAL_CONSUMPTION_KG_PER_YEAR
    product_identity_check_present: true
  dose:
    path: src/cteas_ufotri/exposure/dose_v3/dose_solver.py
    equation: ANNUAL_INTAKE_BQ_TIMES_DOSE_COEFFICIENT_SV_PER_BQ
    age_group_identity_check_present: true
    radionuclide_identity_not_cross_checked_by_solver: true
    pathway_identity_not_cross_checked_by_solver: true
  mass_basis_v3_1:
    path: src/cteas_ufotri/plant/mass_basis_v3_1/contract.py
    direct_comparison_requires_identical_mass_tissue_area_basis: true
    numerical_mass_basis_conversion_implemented: false
    numerical_area_conversion_implemented: false

architecture_decision:
  selected_architecture: OPT_IN_TERMINAL_DIAGNOSTIC_ENDPOINT_ADAPTER
  invocation: EXPLICIT_AFTER_COMPLETED_REPLAY_ENDPOINT
  one_way_readout_only: true
  may_reuse_existing_food_intake_dose_solvers: true
  may_change_existing_solver_equations: false
  may_change_replay_orchestration: false
  may_change_v3_default_pipeline: false
  composite_audit_record_required: true

terminal_harvest_semantics:
  explicit_terminal_event_only: true
  automatic_each_interval_harvest: false
  event_timestamp_must_equal_replay_endpoint: true
  source_state_mutation: false
  same_trajectory_continuation_after_diagnostic_harvest: FORBIDDEN
  remaining_plant_inventory_is_new_dynamic_state: false
  downstream_branch_is_environmental_mass_sink: false
  post_harvest_environmental_conservation_claim: FORBIDDEN
  future_state_mutating_harvest_requires_separate_decision: true

harvest_modes:
  request_mode_must_be_explicit: true
  modes:
    OBT_ONLY:
      obt_fraction_source: HarvestParameters.harvest_fraction
      tfwt_harvest_fraction_required: false
      tfwt_harvest_fraction_must_be_none: true
      expected_food_tfwt_bq: 0.0
    OBT_PLUS_TFWT:
      obt_fraction_source: HarvestParameters.harvest_fraction
      tfwt_harvest_fraction_required: true
      infer_tfwt_fraction_from_obt_fraction: false
      preserve_component_inventories: true

area_geometry_contract:
  replay_inventory_area_basis: soil_surface_area
  allowed_r1_geometry_operation: BQ_PER_M2_SOIL_SURFACE_TIMES_EXPLICIT_HARVEST_AREA_M2_TO_TOTAL_BQ
  harvest_area_is_same_ground_support_extent: true
  leaf_area_conversion: false
  plant_area_conversion: false
  edible_area_conversion: false
  silent_area_conversion: FORBIDDEN
  downstream_mass_basis_area_kind: NOT_APPLICABLE

mass_basis_contract:
  food_product_contract_required: true
  consumption_contract_required: true
  both_subject_ids_must_match_food_product_identifier: true
  tissue_scope_kind_required: HARVEST_PRODUCT
  tissue_scope_identifier_must_match_food_product_identifier: true
  area_basis_kind_required: NOT_APPLICABLE
  direct_comparison_required_before_intake: true
  mass_basis_must_match: true
  tissue_scope_must_match: true
  area_basis_must_match: true
  cross_basis_numerical_conversion: FORBIDDEN
  evidence_declared_metadata_does_not_authorize_numeric_conversion: true
  food_product_mass_kg_uses_food_product_contract_basis: true
  annual_consumption_amount_uses_consumption_contract_basis: true

identity_gates:
  endpoint_obt_tfwt_timestamp_exact: true
  endpoint_obt_tfwt_plant_identifier_exact: true
  endpoint_obt_tfwt_crop_identifier_exact: true
  endpoint_obt_tfwt_growth_stage_exact: true
  harvest_request_plant_identifier_matches_endpoint: true
  harvest_request_crop_identifier_matches_endpoint: true
  harvest_request_growth_stage_matches_endpoint: true
  food_product_identifier_chain_exact: true
  consumption_dose_age_group_exact: true
  dose_radionuclide_identifier_required: H-3
  dose_pathway_identifier_required: food-ingestion
  fuzzy_or_alias_matching: FORBIDDEN
  case_folding_identity_repair: FORBIDDEN

provenance_ownership:
  replay_endpoint: PRESERVE_UPSTREAM
  harvest_event: INDEPENDENT_EXPLICIT_PROVENANCE
  food_product_mass_basis: INDEPENDENT_BASIS_PROVENANCE
  consumption_mass_basis: INDEPENDENT_BASIS_PROVENANCE
  consumption_parameters: INDEPENDENT_EXPLICIT_PROVENANCE
  dose_parameters: INDEPENDENT_EXPLICIT_PROVENANCE
  one_synthetic_provenance_for_all_domains: FORBIDDEN
  composite_audit_record_must_retain_all_domains: true

time_semantics:
  harvest_timestamp: REPLAY_ENDPOINT_TIMESTAMP
  food_timestamp: HARVEST_EVENT_TIMESTAMP
  intake_timestamp: FOOD_EVENT_PROVENANCE_ANCHOR
  dose_timestamp: INTAKE_EVENT_PROVENANCE_ANCHOR
  intake_period: annual
  annual_means_environment_simulated_for_one_year: false
  annual_means_continuous_harvest_transfer_for_one_year: false

selected_future_order:
  - order: 1
    operation: ACCEPT_COMPLETED_REPLAY_ENDPOINT_AND_EXPLICIT_TERMINAL_HARVEST_REQUEST
  - order: 2
    operation: VALIDATE_ENDPOINT_IDENTITIES_AREA_SUPPORT_AND_PROVENANCE_FAIL_CLOSED
  - order: 3
    operation: VALIDATE_EXPLICIT_HARVEST_MODE
  - order: 4
    operation: EXECUTE_EXISTING_FOOD_TRANSFER_SOLVER_DIAGNOSTICALLY_ONCE
  - order: 5
    operation: REQUIRE_DIRECT_MASS_TISSUE_AREA_BASIS_COMPARISON
  - order: 6
    operation: EXECUTE_EXISTING_FOOD_INTAKE_SOLVER_ONCE
  - order: 7
    operation: VALIDATE_AGE_RADIONUCLIDE_PATHWAY_AND_DOSE_PROVENANCE
  - order: 8
    operation: EXECUTE_EXISTING_DOSE_SOLVER_ONCE
  - order: 9
    operation: RETURN_DOWNSTREAM_STATES_AND_COMPOSITE_AUDIT_WITH_UPSTREAM_ENDPOINT_UNCHANGED

future_implementation_acceptance_gates:
  composition:
    direct_v3_solver_chain_equivalence: true
    endpoint_state_unchanged_before_after: true
    food_internal_balance_closure: true
  harvest_modes:
    obt_only_required: true
    obt_plus_tfwt_required: true
    no_implicit_tfwt_fraction: true
  fail_closed_identity:
    timestamp_mismatch: REJECT
    plant_identifier_mismatch: REJECT
    crop_identifier_mismatch: REJECT
    growth_stage_mismatch: REJECT
    product_identifier_mismatch: REJECT
    age_group_mismatch: REJECT
    radionuclide_mismatch: REJECT
    pathway_mismatch: REJECT
  fail_closed_basis:
    mass_basis_mismatch: REJECT
    tissue_scope_mismatch: REJECT
    area_basis_mismatch: REJECT
    cross_basis_conversion_attempt: REJECT
  provenance:
    replay_harvest_basis_consumption_dose_domains_retained: true
    implicit_provenance_inheritance: false
  temporal:
    endpoint_timestamp_preserved: true
    annual_period_is_exposure_transform_only: true
  reproducibility:
    deterministic_repeat: true
  upstream_non_regression:
    v3_default_unchanged: true
    replay_orchestration_unchanged: true
    selected_operator_split_unchanged: true
    replay_coupled_ledgers_unchanged: true

next_stage_recommendation:
  stage: V4_SYSTEM_FOOD_INTAKE_DOSE_ADAPTER_IMPLEMENTATION_R1
  selected_for_post_merge_authorization: true
  implementation_authorized_now: false
  authorization_effective_after_no_drift_merge: true

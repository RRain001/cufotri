    fixed_gamma_66_pa_k: true
site_elevation_contract:
  field_id: site_elevation_m_msl
  canonical_unit: m
  quantity_semantics: SITE_ORTHOMETRIC_OR_EQUIVALENT_HEIGHT_ABOVE_MEAN_SEA_LEVEL
  source_required: true
  required_provenance_fields:
    - source_id
    - source_revision
    - source_dataset_or_authority
    - location_identity
    - horizontal_reference
    - vertical_datum_or_explicit_msl_semantics
    - original_value
    - original_unit
    - transformation_log
  forbidden_substitutes:
    - ATMOS_AIR_SAMPLING_HEIGHT
    - RECEPTOR_HEIGHT_ABOVE_LOCAL_GROUND
    - STACK_HEIGHT
    - TERRAIN_FOLLOWING_MODEL_LEVEL
    - PRESSURE_LEVEL_ALTITUDE
    - ELLIPSOIDAL_HEIGHT_WITHOUT_GEOID_TRANSFORMATION
  ellipsoidal_height_rule:
    direct_relabel_to_msl_allowed: false
    explicit_geoid_or_vertical_datum_transformation_required: true
  ambiguity_policy: FAIL_CLOSED
fao56_derivation:
  pressure_from_elevation:
    formula: P_kPa = 101.3 * ((293 - 0.0065*z_m)/293)^5.26
    z_semantics: site_elevation_m_msl
    missing_z_default_allowed: false
  psychrometric_constant:
    formula: gamma_Pa_per_K = 0.665 * P_kPa
    fixed_66_pa_k_allowed: false
  formula_constants_are_model_approximation_terms: true
dual_source_rule:
  explicit_pressure_has_precedence: true
  elevation_derived_pressure_may_be_diagnostic_cross_check: true
  automatic_blending_allowed: false
  automatic_averaging_allowed: false
  disagreement_tolerance_defined_in_r3: false
identity_separation:
  atmos_air_sampling_height_is_site_elevation: false
  atmos_vertical_reference_is_site_vertical_datum: false
  receptor_location_identity_may_help_match_site: true
  explicit_reconciliation_required: true
fail_closed_conditions:
  - NO_ADMISSIBLE_PRESSURE_AND_NO_ADMISSIBLE_SITE_ELEVATION
  - SEA_LEVEL_PRESSURE_RELABELLED_AS_SITE_PRESSURE
  - AMBIGUOUS_ELEVATION_VERTICAL_SEMANTICS

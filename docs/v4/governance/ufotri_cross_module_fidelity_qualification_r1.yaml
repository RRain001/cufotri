  - id: REEMISSION_AREA_SOURCE
    script: scripts/v4/check_ufotri_reemission_area_source_reconciliation_r1.py
    requirement: PASS_STATUS
  - id: CANADA_BENCHMARK_CONTRACT
    script: scripts/v4/check_ufotri_canada_1987_benchmark_reconstruction_r1.py
    requirement: PASS_STATUS
  - id: ITER_BENCHMARK_CONTRACT
    script: scripts/v4/check_ufotri_iter_benchmark_reconstruction_r1.py
    requirement: PASS_STATUS

root_delay_reconciliation:
  gap_id: UFR-16
  manual_anchor: KfK4605_SEC_2_2_5_APPROX_3H
  manual_delay_seconds: 10800
  historical_runtime_path: src/cteas_ufotri/case.py
  configuration_field: soil.root_uptake_delay_seconds
  queue_semantics: >-
    root uptake at interval n uses the transpiration diagnostic from exactly
    delay_seconds/dt completed intervals earlier; the queue is initialized with
    zeros and the delay must be a non-negative integer multiple of dt.
  reference_case: configs/advanced_test_case.yaml
  reference_dt_seconds: 600
  reference_delay_steps: 18
  current_root_v4_hidden_delay: false
  root_v4_owner: EXPLICIT_EXTERNAL_OR_UPSTREAM_FORCING
  disposition: RECONCILED_EXISTING_HISTORICAL_OPTION_NO_NEW_PHYSICS

rc1_vs_fidelity:
  equality_required: false
  reason: >-
    RC1 is the frozen fallback development baseline while post-RC1 fidelity
    paths intentionally restore manual mechanisms. Numerical equality would
    erase the distinction that the roadmap requires preserving.
  differences:
    leaf_exchange:
      rc1: BASELINE_RESISTANCE_CHAIN
      fidelity: UFOTRI_EQ7_31_OPT_IN
    obt:
      rc1: REDUCED_UFOTRI_KF_KR_BASELINE
      fidelity: RECOVERED_EXCHANGEABLE_ROLE_IN_TFWT_PLUS_NONEXCHANGEABLE_OBT
    soil_hydrology:
      rc1: CONTROLLED_THREE_LAYER_WITH_EXTERNAL_FLUX_BOUNDARY
      fidelity: UFOTRI_EQ33_37_OPT_IN_HYDROLOGY
    foodchain:
      rc1: KEEP_HARVEST_EVENT_ENDPOINT
      fidelity: RECOVERED_CONTINUOUS_UFOTRI_COMPARTMENT_PATHS
    ht_branch:
      rc1: ABSENT_FROM_CONTROLLED_BASELINE
      fidelity: OPT_IN_HT_DEPOSITION_TO_SOIL_HTO_AND_PROVENANCE_HANDOFF
    reemission_area_source:
      rc1: CONTROLLED_LEGACY_COMPATIBILITY_BOUNDARY
      fidelity: UFOTRI_EQ4_TO_EQ6_OPT_IN_ADAPTER
    short_term_root_delay:
      rc1: INACTIVE
      fidelity: HISTORICAL_OPTION_REQUALIFIED_NOT_PROMOTED_TO_ROOT_V4_DEFAULT

allowed_gap_dispositions:
  - COMPLETE_INTERNAL
  - RECONCILED_EXISTING_OPTION
  - COMPLETE_WITH_SOURCE_LIMIT

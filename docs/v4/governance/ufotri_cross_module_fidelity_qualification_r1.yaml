    script: scripts/v4/run_development_baseline_rc1.py
    requirement: PASS_STATUS
  - id: CONTROLLED_E2E
    script: scripts/v4/run_controlled_ufotri_end_to_end_numerical_integration_r1.py
    requirement: PASS_STATUS_AND_REQUIRED_GATES
  - id: OBT_NUMERICAL
    script: scripts/v4/run_ufotri_obt_compartment_conservation_numerical_integration_r1.py
    requirement: PASS_STATUS_INCLUDING_DETERMINISM_RESTART_TIMESTEP_CONSERVATION
  - id: HYDROLOGY_NUMERICAL
    script: scripts/v4/run_ufotri_coupled_water_hto_hydrology_verification_r1.py
    requirement: PASS_STATUS_INCLUDING_TIMESTEP_AND_CONSERVATION
  - id: HT_DERIVED_HTO_PROVENANCE
    script: scripts/v4/check_ufotri_ht_derived_hto_reemission_secondary_feedback_reconciliation_r1.py

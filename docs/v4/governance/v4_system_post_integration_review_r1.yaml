priority_decision_rule: >-
  Prefer the smallest next step that increases end-to-end system connectivity while preserving
  already-frozen physics boundaries. Do not prioritize a subsystem merely because more literature,
  experiments, or documentation are available for it.

candidate_ranking:
  - rank: 1
    candidate: V4_SYSTEM_REPLAY_INPUT_ADAPTER_DECISION_R1
    disposition: RECOMMEND_NEXT_CONTROL_PLANE_STAGE
    rationale:
      - The upstream exchange contract is already frozen, while the new V4 soil-root-TFWT-OBT core is not connected to it.
      - Replay/synthetic records can advance end-to-end integration without waiting for CTEAS-Atmos production completion.
      - A decision stage can freeze ownership of Atmos-derived deposition/air HTO versus separately sourced root q_w and biological forcing before code is written.
      - Existing baseline leaf exchange can be considered without authorizing dynamic Leaf R5.
    implementation_authorized_now: false
    required_decisions:
      - map frozen Atmos record surface deposition to three-layer soil surface input without hidden accumulation-to-rate conversion
      - map air HTO to the existing baseline leaf-exchange path without inferring dynamic stomatal physics from temperature humidity or wind
      - keep root q_w as explicit separately-provenanced forcing; never derive it silently from Atmos fields
      - keep biological forcing explicitly sourced and interval-aligned
      - preserve half-open UTC interval semantics and common area-basis checks
      - define replay and synthetic provenance and fail-closed missing-data behavior
      - decide whether leaf exchange is composed outside or added to the opt-in V4 orchestration seam without changing leaf physics
  - rank: 2
    candidate: FOOD_INTAKE_DOSE_V4_ADAPTER_DECISION
    disposition: DEFER_UNTIL_UPSTREAM_INPUT_BOUNDARY_DECIDED
    rationale:
      - Existing endpoint modules already provide software capability.
      - Current sensitivity evidence identifies several endpoint terms as external scenario or geometry scaling rather than missing environmental transport physics.
      - Closing the upstream forcing boundary first yields a more meaningful end-to-end pathway.
  - rank: 3
    candidate: LEAF_R5_DYNAMIC_STOMATAL_IMPLEMENTATION
    disposition: HOLD
    rationale:
      - R4 remains design-only and lacks the admissible empirical packet required to select or calibrate a dynamic response law.
  - rank: 4
    candidate: OBT_PHYSICS_REDESIGN
    disposition: HOLD
    rationale:
      - Keep the reduced first-order baseline until matched time-resolved TFWT/OBT evidence is available.
  - rank: 5
    candidate: FULL_SOIL_HYDROLOGY_OR_PLANT_WATER_DYNAMICS
    disposition: HOLD
    rationale:
      - The minimal explicit-flux three-layer core now closes the current architectural dependency.
      - Richards/Darcy hydrology and plant-water storage remain unsupported physical expansions.
  - rank: 6
    candidate: REAL_CTEAS_ATMOS_BINDING
    disposition: BLOCKED
    rationale:
      - Frozen exchange contract still records the producer surface-deposition-flux product as unconfirmed.


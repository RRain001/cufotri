schema_version: v1
stage: V4_THREE_LAYER_SOIL_CORE_IMPLEMENTATION_R1
status: IMPLEMENTED_AWAITING_EXACT_HEAD_CI
repository: RRain001/CTEAS_ufotri
base_main_sha: 5241229958fdc4c858336ac2ba22db7d065adda8
branch: codex/v4-three-layer-soil-core-implementation-r1

implementation:
  package: src/cteas_ufotri/plant/soil_v4
  opt_in_only: true
  v3_soil_modified: false
  default_pipeline_modified: false
  full_richards_darcy_solver: false
  hydrology_inference: false
  layer_geometry:
    - {layer_id: L1, depth_top_m: 0.00, depth_bottom_m: 0.05}
    - {layer_id: L2, depth_top_m: 0.05, depth_bottom_m: 0.15}
    - {layer_id: L3, depth_top_m: 0.15, depth_bottom_m: 0.30}

state_contract:
  authoritative_per_layer:
    - water_inventory_m
    - hto_inventory_bq_m2
  derived_per_layer:
    - hto_concentration_bq_m3_water
  concentration_relation: hto_inventory_bq_m2 / water_inventory_m
  canonical_geometry_fail_closed: true
  positive_water_required: true
  nonnegative_hto_required: true
  restart_json_round_trip: true

forcing_contract:
  interval_start_explicit_fluxes: true
  surface_water_input: true
  surface_water_loss: true
  surface_hto_deposition: true
  l1_l2_water_flux_signed_downward_positive: true
  l1_l2_hto_flux_signed_downward_positive: true
  l2_l3_water_flux_signed_downward_positive: true
  l2_l3_hto_flux_signed_downward_positive: true
  lower_boundary_loss: true
  surface_reemission_hto_sink: true
  explicit_root_sink_slots_by_layer: true
  root_sink_derivation_in_core: false
  surface_evaporation_derivation_in_core: false
  water_to_hto_flux_derivation_in_core: false

solver_contract:
  water_storage: conservative_linear_inventory_update
  hto_storage: constant_boundary_flux_plus_radioactive_decay
  decay: analytic_first_order
  internal_layer_flux_applied_equal_and_opposite: true
  layer_ledger: true
  global_ledger: true
  overdraw: fail_closed

ufotri_reference_fixture:
  status: TEST_ONLY_NOT_ACTIVE_PARAMETERIZATION
  volumetric_water_content: 0.25
  water_inventory_m: [0.0125, 0.0250, 0.0375]
  corresponding_manual_kg_m2: [12.5, 25.0, 37.5]

not_implemented:
  - richards_solver
  - darcy_flux_derivation
  - soil_water_potential_curve
  - rainfall_to_interlayer_flux_model
  - capillary_flux_model
  - surface_evaporation_rate_model
  - layer_resolved_root_uptake_derivation
  - ufotri_0_4_percent_per_hour_runtime_activation
  - ufotri_20_80_root_fraction_runtime_activation
  - pipeline_v4_integration
  - default_profile_switch
  - parameter_calibration

verification_required:
  - canonical_geometry
  - ufotri_reference_water_basis
  - state_restart_round_trip
  - downward_interlayer_conservation
  - upward_interlayer_conservation
  - explicit_surface_water_loss_balance
  - external_input_sink_global_balance
  - overdraw_fail_closed
  - v3_v4_type_isolation
  - portable_full_regression
  - frozen_boundary_regression

hard_invariants:
  active_parameters: 0
  calibration_started: false
  leaf_r5_authorized: false
  real_cteas_atmos_coupling_active: false
  v3_default_profile_changed: false
  p7_5_p7_5b_default_coupling_changed: false
  full_richards_darcy_authorized: false
  physical_validation_complete: false

exit_gate:
  current: AWAIT_EXACT_HEAD_CI_AND_INDEPENDENT_REVIEW
  on_pass_next_stage: V4_THREE_LAYER_ROOT_WATER_UPTAKE_R1

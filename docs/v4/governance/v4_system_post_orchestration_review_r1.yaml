priority_rule: >-
  Prefer the smallest next stage that increases connectivity of the complete
  Atmos-to-dose chain while preserving frozen upstream physics and fail-closed
  basis/provenance semantics. A computationally influential endpoint parameter
  does not become validated or active by being wired into the chain.

candidate_ranking:
  - rank: 1
    candidate: V4_SYSTEM_FOOD_INTAKE_DOSE_ADAPTER_DECISION_R1
    disposition: SELECT_NEXT_CONTROL_PLANE_STAGE
    rationale:
      - The previous upstream-boundary deferral condition is now resolved by the merged replay orchestration.
      - Replay endpoint TFWTState and OBTState are already the public types consumed by FoodTransferSolver.
      - Food, intake, and dose are one-way endpoint/readout modules and can increase end-to-end connectivity without changing replay dynamics.
      - Endpoint definitions are computationally material, so event, area, mass-basis, product, and provenance semantics must be frozen before implementation.
    implementation_authorized_now: false
    required_decisions:
      - terminal diagnostic harvest only; no automatic per-interval harvest
      - no continuation of the same dynamic trajectory after non-mutating diagnostic harvest
      - harvest source timestamp equals replay endpoint timestamp
      - source area basis remains soil_surface_area with explicit harvest_area_m2 and no hidden area conversion
      - explicit V3.1 MassBasisContract at the food-product boundary
      - same mass/tissue/area basis for direct comparison; cross-basis numerical conversion remains blocked
      - explicit OBT_ONLY versus OBT_PLUS_TFWT endpoint mode
      - mixed TFWT harvest fraction explicit and independently provenanced
      - independent provenance for harvest, food mass/consumption, and dose coefficient
      - fail-closed food product, consumer, age group, radionuclide, pathway, and period identity
      - endpoint evaluation must not mutate replay soil/TFWT/OBT/root/restart state
      - compose existing endpoint solvers rather than rewrite their equations
      - no default promotion or parameter activation
  - rank: 2
    candidate: POST_END_TO_END_PARAMETER_EVIDENCE_PRIORITY_REVIEW
    disposition: DEFER_UNTIL_ENDPOINT_BOUNDARY_FROZEN
  - rank: 3
    candidate: REAL_CTEAS_ATMOS_BINDING
    disposition: BLOCKED_SURFACE_FLUX_PRODUCT_UNCONFIRMED
  - rank: 4
    candidate: LEAF_R5_DYNAMIC_STOMATAL_IMPLEMENTATION
    disposition: HOLD_R4_EVIDENCE_CHECKPOINT
  - rank: 5
    candidate: OBT_PHYSICS_REDESIGN
    disposition: HOLD_MATCHED_EVIDENCE_REQUIRED
  - rank: 6
    candidate: FULL_SOIL_HYDROLOGY_OR_PLANT_WATER_DYNAMICS
    disposition: HOLD


    p7_6d_parameter_ids: []
    subsystem: plant.soil_v3
    current_model: 'One-layer soil activity storage accepts signed transport as an external flux and does not derive hydrology.'
    current_equation: 'dM_s/dt = F_deposition + F_transport - lambda M_s; transport sign is an explicit interface input.'

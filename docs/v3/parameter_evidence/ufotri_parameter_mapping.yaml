    compartment_relationship: COMPATIBLE_COMPARTMENT
    state_basis_relationship: COMPATIBLE
    required_transformation: NONE
    transformation_possible: false
    future_evidence_recovery_allowed: false
    transformation_derivation: No model transformation is required for the generic Sv/Bq coefficient role.
    mapping_notes: >-
      This is an external/regulatory or scenario-selected dose coefficient, not
      an UFOTRI-derived biological parameter. The manual treats ingested OBT
      like HTO and states that a separate OBT coefficient is not available;
      semantic compatibility therefore does not validate the V3 age/pathway
      coefficient or import the manual value.
    review_status: INDEPENDENT_REVIEWED
    current_status: PROVISIONAL

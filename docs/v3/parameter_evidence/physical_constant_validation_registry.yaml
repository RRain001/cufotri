    reported_quantity: adopted physical half-life of H-3
    reported_value: 4497.0
    reported_uncertainty: 9.0
    reported_unit: d
    uncertainty_convention: combined standard uncertainty; DDEP presentation uses k=1
    canonical_unit: s
    normalized_value: 388540800.0
    normalized_uncertainty: 777600.0
    normalized_unit: s
    conversion_path: 4497 d x 86400 s d^-1 = 388540800 s; 9 d x 86400 s d^-1 = 777600 s; DDEP also reports 12.312(25) years
    evidence_independence: DERIVED_FROM_EXISTING_EVALUATION
    applicability_scope: >-
      Evaluated 3H half-life used only as nuclear-decay evidence; the source

    evaluation_date: '2000-07-27'
    source_kind: EVALUATED_RECOMMENDATION
    underlying_measurement_basis: >-
      NIST reviewed 23 experimentally determined tritium half-life values,
      retained 13 after screening and evaluated them using several statistical
      procedures; the final recommendation is the average of adopted values
      from four recent evaluations.
    source_identifier: doi:10.6028/jres.105.043
    source_url: https://doi.org/10.6028/jres.105.043
    source_locator: Abstract; Table 4; section 8 Final Recommended Value; pp. 541-549
    reported_quantity: recommended physical half-life of H-3
    reported_value: 4500.0
    reported_uncertainty: 8.0
    reported_unit: d
    uncertainty_convention: one standard uncertainty (1 sigma)
    canonical_unit: s
    normalized_value: 388800000.0
    normalized_uncertainty: 691200.0
    normalized_unit: s
    conversion_path: 4500 d x 86400 s d^-1 = 388800000 s; 8 d x 86400 s d^-1 = 691200 s
    evidence_independence: INDEPENDENT_EVALUATION
    applicability_scope: >-
      Universal H-3 radioactive half-life; decay term only; no environmental
      residence, soil-retention, biological-elimination, or OBT half-life.
    lineage_source_evidence_ids: []

parameters:
  - parameter_id: soil.tritium_half_life
    candidate_record_id: candidate.soil.tritium_half_life
    evidence_status: EVIDENCE_FOUND
    validation_status: PASS
    validated_quantity: universal H-3 nuclear half-life
    canonical_unit: s
    selected_value: 388540800.0
    selected_uncertainty: 777600.0
    uncertainty_unit: s
    source_evidence_ids:
      - evidence.nist.tritium_half_life.2000
      - evidence.ddep.tritium_half_life.2006
    selected_source_evidence_id: evidence.ddep.tritium_half_life.2006
    source_agreement_status: CONSISTENT_DERIVED_EVALUATIONS
    reconciliation_method: LATEST_RECOGNIZED_EVALUATED_RECOMMENDATION_WITH_EXPLICIT_LINEAGE
    reconciliation_rationale: >-
      The NIST evaluation reports 4500 +/- 8 d and the later DDEP/BIPM
      evaluation reports 4497 +/- 9 d. Their normalized values differ by
      259200 s, or about 0.25 combined standard uncertainties. DDEP is the
      later recognized evaluated recommendation and explicitly records its
      source lineage to the Lucas and Unterweger evaluation. The DDEP value is
      selected without arithmetic averaging or inverse-variance weighting.
    equation_match: true
    unit_match: true
    applicability_match: true
    independence_review: >-
      NIST and DDEP are separate evaluation authorities, but DDEP is not an
      independent measurement stream: its 3H comments state that the evaluated
      data table was taken from Lucas and Unterweger (2000). The lineage is
      recorded explicitly; only the NIST evaluation is counted as an
      independent evidence stream, and duplicate/derived records never add to
      that count.
    remaining_limitations:
      - >-
        DDEP notes that its evaluated value is for molecular tritium and that
        atomic tritium has a small chemical-state-related difference; the V3
        decay interface intentionally applies no chemical-form correction and
        does not claim atomic-tritium or bare-triton specialization.
      - >-
        The uncertainty is the source one-standard-uncertainty convention; no
        environmental, soil-retention, biological-elimination, or scenario
        uncertainty has been combined with it.
      - >-
        Validation is limited to the radioactive-decay term and does not
        validate soil transport, plant transfer, OBT dynamics, exposure, or
        dose parameters.
    candidate_status: VALIDATION_CANDIDATE
    parameter_status: VALIDATED
    selected_uncertainty_convention: one standard uncertainty (1 sigma; DDEP k=1 presentation)
    benchmark_id: p7.6c1.decay_half_life_fraction
    benchmark_status: PASS
    review_status: INDEPENDENT_REVIEWED

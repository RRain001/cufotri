    source_identifier: doi:10.6028/jres.105.043
    reported_value: 4500
    reported_unit: d
    normalized_value: 388800000
    normalized_unit: s
    applicability: {radionuclide: H-3, chemical_form: ANY_CHEMICAL_FORM, crop: NOT_APPLICABLE, growth_stage: NOT_APPLICABLE, soil_type: NOT_APPLICABLE, environment: ANY_ENVIRONMENT, pathway: radioactive_decay, status: RESOLVED}
    evidence_notes: NIST critical evaluation of the physical H-3 half-life; the reported value is kept separate from the SI normalization and remains control-plane evidence only. The existing V3 decay equation derives lambda_T from this half-life; no runtime parameter import is performed.
    provenance: {repository: CTEAS_ufotri, revision: cdaa6320, file: docs/v3/parameter_evidence/parameter_inventory.yaml, location: 'parameters[soil.tritium_half_life]'}
    review_status: INTERNAL_REVIEWED
    gap_category: A
    equation_role: Derives lambda_T = ln(2) / T_half in the V3 soil radioactive-decay term.
    source_metadata:
      title: Comprehensive Review and Critical Evaluation of the Half-Life of Tritium
      authors:
        - L. L. Lucas
        - M. P. Unterweger
      year: 2000
      journal_or_publisher: Journal of Research of the National Institute of Standards and Technology
      volume: '105'
      issue: null
      pages: 541-549
      identifier: doi:10.6028/jres.105.043
      locator: Abstract; Table 4; pp. 541-549; recommended value
      stable_url: https://doi.org/10.6028/jres.105.043
      reported_quantity: Recommended physical half-life of H-3
      reported_uncertainty: 4500 +/- 8 d
      conversion_path: 4500 d x 86400 s d^-1 = 388800000 s; the existing V3 equation derives lambda_T = ln(2) / T_half.

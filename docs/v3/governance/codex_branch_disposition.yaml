schema_version: v1
stage: repository_audit_remediation
audit_date: '2026-08-25'
repository: RRain001/CTEAS_ufotri
integration_policy:
  rewrite_existing_history: false
  force_push_existing_stage_branches: false
  merge_all_codex_branches: false
  main_merge_authorized: false
  active_parameters: 0
  ufotri_active_database: false
  v3_physics_ready: false

classes:
  CURRENT_CANDIDATE_LINE:
    merge_policy: ONLY_LINE_ELIGIBLE_FOR_FUTURE_INTEGRATION_REVIEW
    description: >-
      Replay/integration line carrying the current V3 runtime plus later
      control-plane, validation, and physics-selection work. Continue from the
      newest member only; do not merge its ancestors individually.
    branches:
      - codex/v3-integration-review
      - codex/v3-p7-6c3-validation-feasibility
      - codex/v3-p7-6d-physics-adoption-decision
      - codex/v3-p7-7a-validation-framework
      - codex/v3-p7-7b-synthetic-benchmark
      - codex/v3-p7-8a-physics-redesign-prioritization
      - codex/v3-p7-8b1-redesign-specification
      - codex/v3-p7-8b2-physics-selection
      - codex/v3-repository-audit-remediation

  CURRENT_RUNTIME_SOURCE_CHECKPOINT:
    merge_policy: REFERENCE_ONLY_ALREADY_REPLAYED
    description: >-
      Typed P6/P7 implementation checkpoints whose core runtime blobs were
      replayed into codex/v3-integration-review. Preserve for audit and bisect;
      do not merge them individually into the current candidate line.
    branches:
      - codex/v3-p6-2a-leaf-exchange-specification
      - codex/v3-p6-2a-independent-review
      - codex/v3-p6-2b-1-resistance-subsystem
      - codex/v3-p6-2b-1-independent-review
      - codex/v3-p6-2b-2-tfwt-solver
      - codex/v3-p6-2b-2-independent-review
      - codex/v3-p6-2b-integration
      - codex/v3-p6-2b-integration-independent-review
      - codex/v3-p6-2c-obt-solver
      - codex/v3-p6-3-soil-hto
      - codex/v3-p6-4-root-uptake
      - codex/v3-p6-5-food-transfer
      - codex/v3-p6-6a-intake-pathway
      - codex/v3-p6-6b-dose-assessment
      - codex/v3-p7-atmos-coupling-interface
      - codex/v3-p7-5-pipeline-integration
      - codex/v3-p7-5b-numerical-coupling-freeze
      - codex/v3-p7-6a-parameter-evidence-freeze
      - codex/v3-p7-6b1-applicability-review
      - codex/v3-p7-6b2a-parameter-candidates
      - codex/v3-p7-6b2b-evidence-recovery
      - codex/v3-p7-6c1-physical-constant-validation
      - codex/v3-p7-6c2-ufotri-semantic-mapping

  SUPERSEDED_ARCHITECTURE_DO_NOT_MERGE:
    merge_policy: DO_NOT_MERGE
    description: >-
      Older V3 architecture line containing the alternate leaf_exchange,
      soil, food_chain, dose, and parameters packages. It is retained only as
      design/audit history and must not be combined with the current plant/*_v3,
      exposure/*_v3, parameters_v3, and v3_pipeline runtime line.
    branches:
      - codex/v3-architecture-only
      - codex/v3-parameter-database-layer
      - codex/v3-ufotri-physics-readiness-audit
      - codex/v3-ufotri-interface-freeze-independent-review
      - codex/v3-ufotri-p5-5-boundary-audit
      - codex/v3-p5-6-architecture-reconciliation
      - codex/v3-p5-6-independent-review
      - codex/v3-p6-1-independent-review

  HISTORICAL_MAIN_ANCESTOR_OR_EVIDENCE_LINE:
    merge_policy: NO_FURTHER_MERGE_REQUIRED
    description: >-
      Historical validation, evidence-acquisition, experiment-design, and
      manual-mapping branches observed by the audit as main ancestors, equal
      checkpoints, or superseded evidence lines. Retain for traceability.
    branches:
      - codex/v2-external-validation-phase1
      - codex/v3-d3-external-evidence-acquisition
      - codex/v3-d3-lab-feasibility-handoff
      - codex/v3-d3-prospective-experiment-dry-run
      - codex/v3-d3-prospective-true-reblinding
      - codex/v3-d3-ufotri-manual-data-mapping
      - codex/v3-d3-ufotri-manual-data-mapping-independent-rereview-r1
      - codex/v3-d3-ufotri-manual-data-mapping-independent-review
      - codex/v3-d3-ufotri-manual-data-mapping-remediation-r1
      - codex/v3-emras-soybean-sb1-independent-review
      - codex/v3-emras-soybean-sb1-pdf-era5
      - codex/v3-emras-soybean-sb4-independent-review
      - codex/v3-emras-soybean-sb4-transfer-benchmark
      - codex/v3-external-evidence-gate-independent-review
      - codex/v3-external-evidence-gate-independent-review-2
      - codex/v3-external-evidence-gate-independent-review-3
      - codex/v3-external-evidence-gate-remediation
      - codex/v3-external-evidence-gate-remediation-2
      - codex/v3-external-evidence-gate-remediation-3
      - codex/v3-external-evidence-unblocking
      - codex/v3-external-input-test-portability-r1
      - codex/v3-sb1-mechanism-independent-review
      - codex/v3-sb1-plant-water-mechanism-discrimination
      - codex/v3-slow-mechanism-discriminability-design
      - codex/v3-slow-mechanism-discriminability-independent-review

rules:
  - >-
    Future V3 work starts from codex/v3-repository-audit-remediation (or an
    explicitly reviewed descendant), never from the superseded architecture line.
  - >-
    A historical stage checkpoint may be used for comparison, bisect, or blob
    provenance, but is not merged individually after its content has been replayed.
  - >-
    SUPERSEDED_ARCHITECTURE_DO_NOT_MERGE branches are permanently excluded from
    normal integration unless a future ADR explicitly reopens one isolated artifact.
  - >-
    CURRENT_CANDIDATE_LINE does not imply production readiness: parameter
    activation, calibration, UFOTRI database activation, and V3 physics readiness
    remain blocked by their independent gates.
  - >-
    main remains outside this remediation branch; a later protected integration
    review must decide whether and how the candidate line enters main.

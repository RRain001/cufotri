name: CUFOTRI Python 3.11 lock regeneration (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_temporary-python311-lock.yml

permissions:
  contents: read

jobs:
  resolve-python311-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-resolve the checked-in requirements for Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.13.5
          uv lock
          uv tree --locked --depth 1
          echo '__CUFOTRI_PY311_LOCK_B64_BEGIN__'
          base64 -w 120 uv.lock
          echo
          echo '__CUFOTRI_PY311_LOCK_B64_END__'

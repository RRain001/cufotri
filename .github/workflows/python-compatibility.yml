name: CUFOTRI Python 3.11 regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "Makefile"
      - ".github/workflows/python-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Python 3.11 portable smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Reuse locked verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: verification
          load: true
          tags: cufotri:smoke-${{ github.sha }}
          cache-from: type=gha,scope=cufotri-py311-deps-v1
      - name: Compile and run focused physical smoke only
        run: |
          docker run --rm "cufotri:smoke-${{ github.sha }}" python scripts/test.py quick

name: Version full regression (manual)

# Not triggered on ordinary source/document PRs. A release is checked as one suite,
# with independent external scientific evidence separately reported as NOT_RUN.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cufotri-version-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-gate:
    name: integration-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned verification environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: verification
          load: true
          tags: cufotri:full-${{ github.sha }}
          cache-from: type=gha,scope=cufotri-py311-deps-v1
      - name: Run one comprehensive portable regression
        run: |
          docker run --rm "cufotri:full-${{ github.sha }}" python scripts/test.py full

name: CUFOTRI temporary uv lock resolution

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/_temporary-uv-lock-resolution.yml]

permissions:
  contents: read

jobs:
  resolve-uv-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate universal uv.lock from project metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          uv --version
          uv lock
          uv tree --locked --depth 1
          echo '__CUFOTRI_LOCK_B64_BEGIN__'
          base64 -w 120 uv.lock
          echo
          echo '__CUFOTRI_LOCK_B64_END__'

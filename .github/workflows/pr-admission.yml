name: PR admission gates

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-admission:
    name: repository-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require formal full software test only for release candidates
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const labels = new Set((pr.labels || []).map(x => x.name));
            if (!labels.has('release-candidate')) {
              core.info('Normal research/development PR: fast Python 3.11 physical smoke is the appropriate check; full Docker is reserved for version release.');
              return;
            }
            const {owner, repo} = context.repo;
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner, repo, ref: pr.head.sha, per_page: 100
            });
            const status = statuses.find(s => s.context === 'ubuntu-docker-full');
            if (!status || status.state !== 'success') {
              core.setFailed('Release candidate requires completed exact-SHA Ubuntu Docker full PASS_SCOPED');
            }

  scientific-admission:
    name: scientific-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply scientific review only to formal empirical/equivalence claims
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const {owner, repo} = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const labels = new Set((pr.labels || []).map(x => x.name));
            const formalLabels = ['scientific-claim', 'original-parity-claim', 'empirical-validation-claim'];
            const formalPaths = /^(?:STATUS\.md$|validation\/benchmarks\/|validation\/external_evidence_acquisition\/|docs\/scientific_claims\/)/;
            const formal = formalLabels.some(label => labels.has(label))
              || files.some(file => formalPaths.test(file.filename) && file.status !== 'removed');
            if (!formal) {
              core.info('Manual-based formula/ODE reconstruction or historical cleanup: no original-executable or field-validation claim made. Independent science review not required for this limited claim.');
              return;
            }
            if (pr.draft) {
              core.setFailed('Formal scientific claim cannot be accepted while Draft');
              return;
            }
            if (!labels.has('science-validated')) {
              core.setFailed('Formal scientific claim requires independently verified science-validated label');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const approved = reviews.some(r => r.state === 'APPROVED'
              && r.commit_id === pr.head.sha && r.user
              && r.user.login !== pr.user.login && r.user.type !== 'Bot');
            if (!approved) {
              core.setFailed('Formal scientific claim lacks an independent non-bot approval at exact PR SHA');
            }
